# The deployment unit for reputation-pool-cloud (issue #5): the app + PostgreSQL together. Flyway (in
# the app) migrates the persistence jar's V1/V2 schema on startup.
#
#   cp .env.example .env              # one-time: provides REPUTATION_POOL_API_KEY (required)
#   docker compose up --build -d      # start app + db
#   grpcurl -H "x-api-key: $KEY" -plaintext localhost:9093 list   # engine reachable over gRPC
#
# Production injects REPUTATION_POOL_API_KEY (and optionally REPUTATION_POOL_DB_PASSWORD) from a secret
# store; there is no committed default for the API key on purpose.
#
# The app connects to the db over the compose network (db:5432). Host ports are published for local
# convenience but the app's HTTP port (8083) and gRPC port (9093) are bound to loopback (127.0.0.1)
# only — browsers reach the stack through Caddy (:8080), never the app directly.
#
# XFF trust boundary (issue #28): server.forward-headers-strategy=framework trusts X-Forwarded-For, so
# the login throttle keys its per-IP limit on that header. That is only safe while 8083 is NOT directly
# reachable from outside — a direct client could forge X-Forwarded-For to dodge or frame another IP.
# Hence the loopback binding below; do not republish 8083 (or 9093) on 0.0.0.0. See
# docs/engineering/security.md.
services:
  db:
    image: postgres:17
    container_name: reputation-pool-db
    environment:
      POSTGRES_DB: reputation_pool
      POSTGRES_USER: reputation_pool
      # Interpolated from the host env so a real secret can be injected; falls back to a local-dev
      # throwaway when unset. app and db share the one variable so they always agree.
      POSTGRES_PASSWORD: ${REPUTATION_POOL_DB_PASSWORD:-reputation_pool}
    ports:
      - "5435:5432"
    volumes:
      - reputation-pool-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reputation_pool -d reputation_pool"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
    container_name: reputation-pool-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Connects over the compose network. The password is interpolated from the host env — set
      # REPUTATION_POOL_DB_PASSWORD (from a secret) to inject it in production; unset falls back to the
      # local-dev throwaway. A literal value here would shadow the host env and break secret injection.
      REPUTATION_POOL_DB_URL: jdbc:postgresql://db:5432/reputation_pool
      REPUTATION_POOL_DB_USERNAME: reputation_pool
      REPUTATION_POOL_DB_PASSWORD: ${REPUTATION_POOL_DB_PASSWORD:-reputation_pool}
      # gRPC API key — REQUIRED, no default. A fallback would put a known key on the public API
      # (auth bypass), so compose fails if it is unset: copy .env.example to .env for local dev, or
      # inject the secret in production. Clients send it in the x-api-key metadata header.
      REPUTATION_POOL_API_KEY: ${REPUTATION_POOL_API_KEY:?set REPUTATION_POOL_API_KEY (copy .env.example to .env for local dev)}
      # REST control-plane admin login (issue #11). Optional: unset leaves the admin console disabled
      # (fail closed — /api/** rejects everything), so the gRPC data plane above works without them. Set
      # all three to use the console; JWT_SECRET must be at least 32 bytes (HS256 needs a 256-bit key).
      REPUTATION_POOL_ADMIN_USERNAME: ${REPUTATION_POOL_ADMIN_USERNAME:-}
      REPUTATION_POOL_ADMIN_PASSWORD: ${REPUTATION_POOL_ADMIN_PASSWORD:-}
      REPUTATION_POOL_ADMIN_JWT_SECRET: ${REPUTATION_POOL_ADMIN_JWT_SECRET:-}
      # Tenant that the admin console is scoped to (issue #11: v1 has no RBAC, so one admin login is
      # bound to one tenant and can only manage that tenant's API keys / read model). Defaults to
      # `default`; set REPUTATION_POOL_ADMIN_TENANT to point the console at another tenant (e.g. the
      # scraper's own tenant so its keys can be issued from the console). Explicit `:-default` rather
      # than `:-` so an unset value never becomes the empty string.
      REPUTATION_POOL_ADMIN_TENANT: ${REPUTATION_POOL_ADMIN_TENANT:-default}
      # Per-tenant request ceiling on the data plane (issue #132). ENABLED=false is the escape hatch:
      # it makes the limiter a no-op without a rebuild, for when the limiter itself is suspected of
      # blocking healthy traffic.
      #
      # These carry explicit defaults rather than the `${VAR:-}` used above, and must keep doing so.
      # `${VAR:-}` does not omit the variable when it is unset — it sets it to the **empty string**, and
      # Spring cannot convert "" to a primitive: it becomes null and `@DefaultValue` does not apply
      # (that only fires when the property is absent entirely). The app then dies at startup with
      # `Failed to bind properties under 'reputation-pool.rate-limit.enabled' to boolean`. The admin
      # variables above survive the same pattern only because they bind to String.
      #
      # The values must match RateLimitProperties' @DefaultValue. RateLimitPropertiesBindingTest reads
      # this file and fails if they drift or if the `:-` form comes back.
      REPUTATION_POOL_RATE_LIMIT_ENABLED: ${REPUTATION_POOL_RATE_LIMIT_ENABLED:-true}
      REPUTATION_POOL_RATE_LIMIT_REQUESTS_PER_SECOND: ${REPUTATION_POOL_RATE_LIMIT_REQUESTS_PER_SECOND:-10}
      REPUTATION_POOL_RATE_LIMIT_BURST: ${REPUTATION_POOL_RATE_LIMIT_BURST:-50}
      REPUTATION_POOL_RATE_LIMIT_MAX_CONCURRENT_STREAMS: ${REPUTATION_POOL_RATE_LIMIT_MAX_CONCURRENT_STREAMS:-20}
    ports:
      # Loopback-only: reachable from the host for local dev, but not exposed to the network. This is the
      # premise of the login throttle's X-Forwarded-For trust — see the header comment and #28.
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Give the JVM + Flyway room to come up before health failures count against the container.
      start_period: 40s
    restart: unless-stopped

  # 대시보드(#12) — Next.js standalone. 호스트에 포트를 열지 않고 Caddy를 통해서만 노출된다.
  # BACKEND_ORIGIN은 standalone 서버의 /api·/actuator rewrite가 쓰는 백엔드 주소(compose 네트워크).
  dashboard:
    build:
      context: ./dashboard
    container_name: reputation-pool-dashboard
    depends_on:
      app:
        condition: service_healthy
    environment:
      BACKEND_ORIGIN: http://app:8083
    restart: unless-stopped

  # 한 오리진 서빙(#15 / D8): /api·/actuator → app, 나머지 → dashboard. 브라우저는 여기(8080)만 본다.
  caddy:
    image: caddy:2
    container_name: reputation-pool-caddy
    depends_on:
      - app
      - dashboard
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 오리진 다운 화면(#134). dashboard 이미지가 아니라 **Caddy 쪽**에 있어야 한다 — 이 화면이 뜨는
      # 순간은 dashboard 컨테이너가 없는 순간이라, 거기서 서빙되는 것은 무엇이든 함께 사라진다.
      - ./caddy:/srv/caddy:ro
      - caddy-data:/data
    restart: unless-stopped

  # 모니터링(#14 / D7b). app 의 /actuator/prometheus 를 스크레이프해 시계열로 쌓고 Grafana 로 본다.
  # 둘 다 compose 네트워크 내부에서만 동작: Prometheus 는 호스트 포트를 안 열고 app:8083 을 직접 긁으며
  # (이 엔드포인트는 permitAll 이지만 Caddy 로는 외부 차단 — 신뢰 경계=네트워크), Grafana 만 로컬 확인용
  # 으로 loopback 3001 에 노출한다. 프로덕션 노출/인증은 #15 후속(Caddy 뒤 or 별도 통제).
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: reputation-pool-prometheus
    depends_on:
      # service_healthy 가 아니라 service_started 다 (#79 리뷰). app 이 최초 기동부터 unhealthy 이면
      # (DB 연결 실패, Flyway 마이그레이션 실패 등) service_healthy 조건은 영원히 충족되지 않아
      # Prometheus 자체가 시작하지 않는다. 그러면 스크레이프가 없어 up 시계열도 없고, 하필 그 상황을
      # 알리려고 만든 TargetDown/TargetMissing 이 무동작한다 — "앱이 망가졌는데 조용하다"가 정확히
      # 재현된다. Prometheus 는 대상이 죽어 있어도 정상 동작하는 것이 본래 설계이므로 함께 띄운다.
      app:
        condition: service_started
      alertmanager:
        condition: service_started
    # command 를 주면 이미지 기본 인자가 전부 대체되므로 설정 경로도 함께 적어야 한다.
    #
    # 보존 기간(#79): 기본값은 15일이다. 알림만 보면 그걸로 충분하지만(가장 긴 창이 3일),
    # "이번 달 에러버짓이 얼마 남았나" 는 30일치가 있어야 계산된다 — SLO 창이 30일이라서다.
    # 그래서 31일 + 하루 여유 = 32일. 늘어나는 건 주로 디스크이고(메모리에 상주하는 head 블록은
    # 약 2시간분), 실제 크기는 시계열 수에 비례한다: `/api/v1/status/tsdb` 로 확인할 수 있다.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=32d
    # **파일 하나씩 마운트하지 않는다 — 디렉터리를 마운트한다.**
    #
    # 단일 파일 bind mount 는 호스트에서 그 파일이 **교체**되면(git pull 은 새 파일을 쓰고 rename 한다)
    # 컨테이너의 마운트가 삭제된 옛 inode 를 계속 가리킨다. 그러면 배포가 성공해도 컨테이너 안의 설정은
    # 9일 전 그대로이고, SIGHUP 리로드조차 옛 파일을 다시 읽을 뿐이라 **조용히 아무 일도 일어나지 않는다.**
    # 2026-08-06 #131 이 정확히 그렇게 실패했다: 룰과 스크레이프 대상을 추가하고 배포했는데 Prometheus 는
    # 새 룰 그룹을 로드하지 않았고, 실측 결과 inode 가 호스트 535249 / 컨테이너 575320 으로 갈려 있었다.
    #
    # 디렉터리 bind mount 는 그 문제가 없다 — 컨테이너가 디렉터리를 보므로 그 안의 파일이 교체돼도 새
    # 파일이 보인다. `grafana` 는 처음부터 이 방식이었고(provisioning/·dashboards/) 그래서 같은 배포에서
    # 대시보드 변경은 정상 반영됐다. 경로는 그대로 유지된다: `/etc/prometheus/alerts.yml` 등이 그 자리에
    # 그대로 나타나므로 `prometheus.yml` 의 `rule_files` 도 바꿀 필요가 없다.
    #
    # monitoring/ 전체가 들어오지만(alertmanager.yml·grafana/·README.md) 읽기 전용이고 Prometheus 는
    # 자기가 지정된 파일만 읽는다.
    volumes:
      - ./monitoring:/etc/prometheus:ro
      - reputation-pool-prometheus-data:/prometheus
    restart: unless-stopped

  # 알림 라우팅(#76). alerts.yml 의 SLO 룰이 firing 되면 Prometheus 가 여기로 넘겨(prometheus.yml 의
  # alerting.alertmanagers) grouping/dedup/silence/정비창을 맡는다. 호스트 포트를 열지 않는 compose
  # 네트워크 전용 서비스 — Prometheus/Grafana 와 같은 posture. 기본은 monitoring/alertmanager.yml 의
  # receiver 가 무통합(zero integrations) blackhole 이라 실제 webhook URL 없이도 뜬다. 실제 webhook 을
  # 붙이려면 REPUTATION_POOL_ALERTMANAGER_WEBHOOK_URL 에 URL 을 넣고 monitoring/alertmanager.yml 의
  # webhook_configs 주석을 해제한다 — url_file 이 아래 secrets 로 마운트된 파일을 가리키므로 URL 자체는
  # 설정 파일에 담기지 않는다(monitoring/README.md "알림 라우팅" 참고).
  alertmanager:
    image: prom/alertmanager:v0.31.1
    container_name: reputation-pool-alertmanager
    # prometheus 와 같은 이유로 디렉터리를 마운트한다(위 주석 참고) — 단일 파일 마운트는 git pull 이 파일을
    # 교체하면 옛 inode 에 고착된다. 여기서도 실측했다: 호스트 575318 / 컨테이너 534759. `alertmanager.yml`
    # 은 아직 바뀐 적이 없어 드러나지 않았을 뿐이고, 다음에 라우팅을 고치면 조용히 반영되지 않는다.
    # 기본 `--config.file` 이 `/etc/alertmanager/alertmanager.yml` 이므로 경로는 그대로다.
    volumes:
      - ./monitoring:/etc/alertmanager:ro
      - reputation-pool-alertmanager-data:/alertmanager
    secrets:
      - alertmanager_webhook_url
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: reputation-pool-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # fail-closed: 알려진 admin/admin 을 두지 않는다 — 비밀번호는 필수다. 미설정 시 compose 가 즉시
      # 실패한다(REPUTATION_POOL_API_KEY 와 동일 규약). 로컬은 .env(.env.example 복사), 프로덕션은 시크릿.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD (copy .env.example for local dev)}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      # loopback 만: 로컬에서 대시보드 확인용. 외부 노출은 #15 후속.
      - "127.0.0.1:3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - reputation-pool-grafana-data:/var/lib/grafana
    restart: unless-stopped

  # 일일 DB 백업(#15). db 를 pg_dump(-Fc)로 덤프해 backups 볼륨에 남기고 보존 기간 경과분을 지운다.
  # postgres:17 이미지의 pg_dump/pg_restore 를 그대로 써 추가 의존이 없다. 하루 한 번 실행 후 대기하며,
  # 복원은 scripts/restore.sh, 복원 가능성은 RestoreRehearsalIT 가 자동 검증한다(#15 종료 기준).
  backup:
    image: postgres:17
    container_name: reputation-pool-backup
    depends_on:
      db:
        condition: service_healthy
    environment:
      # db 컨테이너와 같은 비밀번호. app/db 와 동일 변수로 항상 일치.
      PGPASSWORD: ${REPUTATION_POOL_DB_PASSWORD:-reputation_pool}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    # 성공 시 24h 대기, 실패 시 1h 뒤 재시도 — 일시적 장애로 하루치 백업을 통째로 잃지 않도록.
    entrypoint: ["/bin/sh", "-c", "while true; do if /usr/local/bin/backup.sh; then sleep 86400; else echo 'backup failed (1시간 후 재시도)'; sleep 3600; fi; done"]
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ./scripts/restore.sh:/usr/local/bin/restore.sh:ro
      - reputation-pool-backups:/backups
      # 덤프 성공 시각을 여기에 쓴다 — node-exporter 가 읽어 Prometheus 에 노출한다(#131).
      - reputation-pool-metrics:/metrics
    restart: unless-stopped

  # 백업 신선도 SLI 의 노출 경로 (#131).
  #
  # ## 왜 필요한가
  # `backup-offsite.sh` 는 **돌다가 실패하면** 메일을 보내지만, 타이머가 죽어 **아예 안 도는** 경우에는
  # 아무 신호가 없다. 조용한 실패의 전형이고 #80 의 `CheckpointStale` 이 막은 것과 같은 형태다. 그래서
  # 두 스크립트가 마지막 성공 시각을 `.prom` 파일로 남기고, 이 컨테이너가 그것을 스크레이프 가능한
  # 형태로 노출한다(`alerts.yml` 의 `BackupStale`/`OffsiteBackupStale`).
  #
  # ## 왜 노드 메트릭은 켜지 않는가
  # **`--collector.disable-defaults` 로 전부 끄고 textfile 하나만 켠다.** 필요한 것은 textfile collector
  # 뿐이고, 호스트 메트릭(cpu·메모리·디스크)을 켜려면 `/proc`·`/sys` 를 마운트하고 host PID·network 를
  # 공유해야 한다 — 공개 서버에서 그건 이 이슈가 요구하지 않은 보안 표면 확대다. 전부 끄면 이 컨테이너는
  # 볼륨 하나만 읽는 격리된 프로세스가 되고 메모리도 수십 MB 로 끝난다. 호스트 지표가 필요해지면 그때
  # collector 를 켜는 별도 결정으로 다룬다.
  #
  # ## 왜 정적 파일 서버가 아니라 node-exporter 인가
  # textfile collector 가 `*.prom` 파싱·중복 검사·형식 검증을 이미 한다(잘못 쓴 파일은 스크레이프 오류로
  # 드러난다). 같은 것을 직접 만들면 그 검증을 다시 구현해야 한다.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: reputation-pool-node-exporter
    command:
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/metrics
      # 호스트 포트를 열지 않는다 — prometheus/grafana/alertmanager 와 같은 posture(compose 네트워크 전용).
      - --web.listen-address=:9100
    volumes:
      # read-only: 이 컨테이너는 읽기만 한다. 쓰는 쪽은 backup 사이드카와 호스트의 backup-offsite.sh 다.
      - reputation-pool-metrics:/metrics:ro
    restart: unless-stopped

volumes:
  reputation-pool-db-data:
  caddy-data:
  reputation-pool-prometheus-data:
  reputation-pool-grafana-data:
  reputation-pool-alertmanager-data:
  reputation-pool-backups:
  # 백업 신선도 textfile (#131). 쓰는 쪽이 둘이라 named volume 을 쓴다 — backup 사이드카는 컨테이너
  # 마운트로, 호스트의 backup-offsite.sh 는 `docker run -v … alpine` 으로 쓴다(그 스크립트가 덤프를 꺼낼
  # 때 이미 쓰는 패턴이다). bind mount 로 두면 호스트에 디렉터리를 미리 만들어야 하고 bootstrap.sh 가
  # 그 일을 하지 않으므로, 새 사전 조건을 만들지 않는 쪽을 택했다.
  reputation-pool-metrics:

# Compose Spec 의 secrets(environment 소스, #76): 커스텀 entrypoint/envsubst 렌더링 없이 호스트 환경
# 변수 값을 파일로 자동 마운트한다(/run/secrets/<name>). REPUTATION_POOL_ALERTMANAGER_WEBHOOK_URL 이
# 빈 값이면(로컬 기본) 빈 파일이 마운트될 뿐이라 실제 webhook URL 없이도 docker compose up 이 성공한다.
#
# 단, 변수가 아예 정의돼 있지 않으면(빈 값이 아니라 미정의) 이 소스는 컨테이너 생성 시점에 하드 실패한다
# ("environment variable ... required by file ... is not set"). docker compose config 는 그대로 통과하므로
# up 에서만 드러난다 — 그래서 .env.example 은 이 변수를 다른 optional 변수들과 달리 주석 처리하지 않고
# 빈 값으로 정의해 둔다. 프로덕션에서도 webhook 을 쓰지 않더라도 이 변수는(빈 값으로라도) 주입해야 한다.
secrets:
  alertmanager_webhook_url:
    environment: REPUTATION_POOL_ALERTMANAGER_WEBHOOK_URL
