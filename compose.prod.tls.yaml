# 도메인 + 자동 HTTPS 오버레이 (#15 / D8) — `compose.prod.yaml` 위에 한 겹 더 얹는다.
#
#   ./scripts/bootstrap.sh compose.prod.tls.yaml
#
# 또는 수동으로:
#   docker compose -f compose.yaml -f compose.prod.yaml -f compose.prod.tls.yaml up -d
#
# 왜 분리했나: `compose.prod.yaml` 이 DOMAIN 을 필수로 요구하면 **도메인이 없는 동안 스택을 아예 띄울 수
# 없다.** 도메인 등록·DNS 전파는 컴퓨트 확보와 독립된 작업이라, 임시 호스트에서 배포 경로를 먼저 검증하는
# 길을 막을 이유가 없다. 그래서 TLS 에만 필요한 것(도메인·ACME·443·Caddyfile.prod)을 여기로 모았다.
#
# 변수 보간은 파일을 읽는 시점에 일어나므로, `${DOMAIN:?}` 를 아래쪽 오버레이로 무력화할 수 없다 —
# 필수 요구를 이 파일에 두는 것이 유일한 방법이다(그래서 평문 경로는 이 파일을 아예 넣지 않는다).
services:
  caddy:
    environment:
      # 서비스할 호스트네임. 미설정이면 여기서 즉시 실패한다 — 빈 사이트 주소로 Caddy 가 죽어
      # 인증서 발급 실패로 보이는 것보다 낫다.
      DOMAIN: ${DOMAIN:?set DOMAIN (e.g. app.example.com) — Caddy 사이트 주소이자 인증서 대상}
      # Let's Encrypt 계정 메일. 만료·발급 실패 알림이 여기로 온다.
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL — 인증서 만료 알림 수신 주소}
    # 443/udp 는 HTTP/3. Caddy 가 :80 을 HTTPS 로 자동 리다이렉트한다.
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # 같은 마운트 지점(/etc/caddy/Caddyfile)에 두 파일이 겹치지 않도록 목록을 통째로 교체한다.
    volumes: !override
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      # 목록을 통째로 교체하므로 base 의 마운트도 여기 다시 적어야 한다 — 빠지면 오리진 다운 화면(#134)이
      # 프로덕션에서만 404 로 나간다(정작 필요한 곳에서만 없는 셈).
      - ./caddy:/srv/caddy:ro
      # 발급된 인증서가 여기 남는다. 이 볼륨을 지우면 재발급이 일어나 Let's Encrypt 레이트리밋을
      # 소모하므로 `compose down -v` 를 프로덕션에서 쓰지 않는다.
      - caddy-data:/data

  # Grafana 외부 노출 (#15 후속). Caddyfile.prod 의 `handle /grafana*` 와 짝이다.
  #
  # **이 오버레이에만 둔다.** `GF_SERVER_ROOT_URL` 은 실제 https 호스트명을 알아야 하는데 그것을 보장하는
  # 파일이 여기뿐이고(위 `${DOMAIN:?}`), base 에 두면 도메인 없는 평문·로컬 모드에서 `https:///grafana/`
  # 로 렌더되어 Grafana 가 자기 링크를 전부 깨뜨린다. 로컬은 계속 `127.0.0.1:3001` 루트 경로로 쓴다.
  #
  # loopback 포트 공개(base 의 `127.0.0.1:3001:3000`)는 그대로 남긴다 — 외부 경로가 막혔을 때
  # SSH 터널로 들어갈 수 있는 뒷문이 하나 있어야 하고, loopback 이라 노출이 늘지 않는다.
  #
  # 단, SERVE_FROM_SUB_PATH 를 켜면 Grafana 는 **루트 경로를 더 서비스하지 않는다.** 이 오버레이가
  # 적용된 호스트에서 터널로 들어갈 때 주소가 바뀐다:
  #     ssh -N -L 3001:127.0.0.1:3001 <호스트>  →  http://localhost:3001/grafana/
  # (`/grafana/` 없이 루트로 들어가면 404 다. 이 오버레이를 쓰지 않는 로컬 개발은 루트 그대로다.)
  grafana:
    environment:
      # 서브패스로 서비스한다. 둘은 반드시 같이 간다 — ROOT_URL 만 주면 Grafana 가 링크는 /grafana 로
      # 만들지만 라우팅은 루트로 기대해서 404 가 되고, SERVE_FROM_SUB_PATH 만 주면 절대 URL 이 깨진다.
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # 인터넷에 노출되는 순간 필요해지는 것들. base 의 `GF_USERS_ALLOW_SIGN_UP=false` 와 Grafana 기본
      # 브루트포스 보호는 이미 켜져 있으므로 여기서는 그 둘이 못 막는 것만 닫는다.
      #
      # 세션 쿠키를 HTTPS 전용으로. 평문으로 새는 경로를 없앤다(이 오버레이는 항상 HTTPS 다).
      GF_SECURITY_COOKIE_SECURE: "true"
      # 스냅샷 외부 발행 차단. 기본값이 켜져 있어서 대시보드 한 번의 오조작으로 **우리 메트릭이 담긴
      # 스냅샷이 외부 공개 서버로 업로드**된다. 관측 데이터는 내부 정보이고, 이 기능을 쓸 일도 없다.
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
