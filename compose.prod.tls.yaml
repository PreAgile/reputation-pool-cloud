# 도메인 + 자동 HTTPS 오버레이 (#15 / D8) — `compose.prod.yaml` 위에 한 겹 더 얹는다.
#
#   ./scripts/bootstrap.sh compose.prod.tls.yaml
#
# 또는 수동으로:
#   docker compose -f compose.yaml -f compose.prod.yaml -f compose.prod.tls.yaml up -d
#
# 왜 분리했나: `compose.prod.yaml` 이 DOMAIN 을 필수로 요구하면 **도메인이 없는 동안 스택을 아예 띄울 수
# 없다.** 도메인 등록·DNS 전파는 컴퓨트 확보와 독립된 작업이라, 임시 호스트에서 배포 경로를 먼저 검증하는
# 길을 막을 이유가 없다. 그래서 TLS 에만 필요한 것(도메인·ACME·443·Caddyfile.prod)을 여기로 모았다.
#
# 변수 보간은 파일을 읽는 시점에 일어나므로, `${DOMAIN:?}` 를 아래쪽 오버레이로 무력화할 수 없다 —
# 필수 요구를 이 파일에 두는 것이 유일한 방법이다(그래서 평문 경로는 이 파일을 아예 넣지 않는다).
services:
  caddy:
    environment:
      # 서비스할 호스트네임. 미설정이면 여기서 즉시 실패한다 — 빈 사이트 주소로 Caddy 가 죽어
      # 인증서 발급 실패로 보이는 것보다 낫다.
      DOMAIN: ${DOMAIN:?set DOMAIN (e.g. app.example.com) — Caddy 사이트 주소이자 인증서 대상}
      # Let's Encrypt 계정 메일. 만료·발급 실패 알림이 여기로 온다.
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL — 인증서 만료 알림 수신 주소}
    # 443/udp 는 HTTP/3. Caddy 가 :80 을 HTTPS 로 자동 리다이렉트한다.
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # 같은 마운트 지점(/etc/caddy/Caddyfile)에 두 파일이 겹치지 않도록 목록을 통째로 교체한다.
    volumes: !override
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      # 목록을 통째로 교체하므로 base 의 마운트도 여기 다시 적어야 한다 — 빠지면 오리진 다운 화면(#134)이
      # 프로덕션에서만 404 로 나간다(정작 필요한 곳에서만 없는 셈).
      - ./caddy:/srv/caddy:ro
      # 발급된 인증서가 여기 남는다. 이 볼륨을 지우면 재발급이 일어나 Let's Encrypt 레이트리밋을
      # 소모하므로 `compose down -v` 를 프로덕션에서 쓰지 않는다.
      - caddy-data:/data
