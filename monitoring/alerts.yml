# SLO 기반 알림 규칙 (#14 / D7b). Prometheus 가 룰을 평가하고(ALERTS 시계열/그래프로도 확인 가능),
# firing 알림은 prometheus.yml 의 alerting.alertmanagers 를 통해 Alertmanager 로 넘어가 grouping·
# dedup·silence 를 거쳐 통지된다(#76). 지표는 #68 로 이미 노출된 http_server_requests(가용성·지연)와
# hikaricp(DB 풀), reputation.*(도메인), grpc_server_*(데이터플레인 #78)에서 뽑는다.
#
# 임계값을 이 파일에 숫자로 박은 룰과, 앱이 게이지로 노출한 설정값을 읽는 룰이 섞여 있다. 후자(#77)는
# Prometheus 가 룰 파일에서 환경변수를 치환하지 않기 때문에 그렇게 했다 — 자세한 근거는 해당 룰 주석과
# application.yml 의 surge-thresholds 블록 참고.
#
# 이 파일은 CI 에서 promtool 로 검증된다: `check rules`(문법) + `test rules monitoring/alerts-test.yml`
# (시계열을 주입해 발화 여부를 단정하는 단위 테스트). 룰을 고치면 그 테스트도 같이 고친다.
groups:
  - name: reputation-pool-slo
    rules:
      # 가용성 SLO: 5xx 비율이 5% 를 5분 이상 초과.
      - alert: HighServerErrorRate
        expr: >
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx 비율 5% 초과 (최근 5분)"
          description: "control-plane/actuator 응답의 5xx 비율이 SLO(5%)를 넘었습니다."

      # 지연 SLO: HTTP p99 가 500ms 를 5분 이상 초과.
      - alert: HighRequestLatencyP99
        expr: >
          histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP p99 지연 500ms 초과 (최근 5분)"

      # DB 풀 포화: 커넥션을 기다리는 스레드가 5분 이상 존재.
      - alert: DbConnectionPoolPending
        expr: hikaricp_connections_pending > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DB 커넥션 풀 대기 발생 (최근 5분)"

      # 도메인 신호: 리소스 차단이 급증(5분 내 분당 10건 초과).
      - alert: ResourceBlocklistSurge
        expr: sum(rate(reputation_resource_blocklisted_total[5m])) * 60 > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "리소스 차단 급증 (분당 10건 초과, 최근 5분)"

      # gRPC 데이터플레인 지연 SLO (#78): Acquire/Report(실제 서빙 경로) p99 가 500ms 를 5분 이상 초과.
      # net.devh의 GrpcServerMetricAutoConfiguration 이 이미 모든 RPC를 grpc_server_processing_duration_seconds
      # 로 계측하고 있고, application.yml 의 percentiles-histogram 설정으로 _bucket 시계열이 노출된다.
      #
      # method 를 유지한 채(`by (le, method)`) 메서드별로 따로 평가한다 — 두 RPC 의 지연 프로파일이 애초에
      # 다르기 때문이다(Acquire 는 평판 스코어링, Report 는 셀 갱신). 버킷을 합산하면 트래픽이 많고 빠른
      # Acquire 가 느린 Report 를 가려 알림이 조용히 무동작하게 된다. method 는 6개 RPC 로 유한하니
      # 카디널리티 부담도 없다.
      - alert: GrpcLatencyP99
        expr: >
          histogram_quantile(0.99, sum by (le, method) (rate(grpc_server_processing_duration_seconds_bucket{method=~"Acquire|Report"}[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "gRPC {{ $labels.method }} p99 지연 500ms 초과 (최근 5분)"

      # gRPC 에러율 SLO (#78): 서버 귀책 상태코드 비율이 5% 를 5분 이상 초과.
      #
      # `statusCode != "OK"` 를 그대로 쓰지 않는 이유 — 이 타이머는 6개 RPC 를 모두 계측하므로 서버가
      # 정상인데도 non-OK 가 쌓이는 경로가 두 개 있다:
      #   * SubscribeEvents 는 서버 스트리밍이라 클라이언트가 끊을 때마다 CANCELLED 로 종료된다. 정상
      #     구독 종료가 영구적으로 에러율을 끌어올려 알림이 상시 firing 이 된다 → methodType 으로 배제.
      #   * UNAUTHENTICATED/INVALID_ARGUMENT/RESOURCE_EXHAUSTED 는 클라이언트 귀책이거나 설계된 거절이다
      #     (잘못된 API 키, 잘못된 요청, #84 전역 예산 거절). 서버는 정상 동작 중이므로 가용성 SLO 위반이
      #     아니다 — 예산 소진은 별도 도메인 신호로 다룰 문제고 여기서 페이지를 울릴 사안이 아니다.
      # 그래서 서버 귀책 코드만 분자로 센다. 또 메서드별로 쪼개지 않고 데이터플레인 전체 비율로 평가한다:
      # critical 페이지라 트래픽이 적은 메서드(예: 하루 몇 건의 Report)에서 단 1건의 에러가 100% 로 잡혀
      # 울리는 걸 막아야 한다. 메서드별 분해는 Grafana 대시보드가 담당한다.
      - alert: GrpcHighErrorRate
        expr: >
          sum(rate(grpc_server_processing_duration_seconds_count{methodType!="SERVER_STREAMING",statusCode=~"UNKNOWN|INTERNAL|UNAVAILABLE|DATA_LOSS|DEADLINE_EXCEEDED"}[5m]))
          / sum(rate(grpc_server_processing_duration_seconds_count{methodType!="SERVER_STREAMING"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "gRPC 서버 귀책 에러율 5% 초과 (최근 5분)"

      # 도메인 신호: 리소스 냉각 급증 (#77). COOLING 은 정상 사이클의 한 칸이므로(core ResourceState:
      # HEALTHY → COOLING → RECOVERING → HEALTHY) 개별 전이는 알리지 않는다 — 짧은 시간에 여러 자원이
      # 함께 냉각되는 "속도"만 신호다. 원인이 자원 하나에 있을 수 없는 층위이고, 운영자가 개입할 여지가
      # 있는 것도 이 층위뿐이다. 차단(ResourceBlocklistSurge)보다 앞선 조기 신호다.
      #
      # 카운터는 이미 전이당 1회로 중복제거돼 있다 — core ReputationEngine.shouldCool 이 쿨다운이 살아
      # 있는 동안의 추가 실패로는 재냉각도 재이벤트도 만들지 않는다("이미 벌 받고 있는 사건에 속한 늦게
      # 도착한 결과"). 그래서 룰에서 중복을 따로 걸러낼 필요가 없다.
      #
      # cause 로 쪼개지 않는다: 임계가 원인별로 적용되면 여러 원인에 고르게 퍼진 급증을 전부 놓친다
      # (alerts-test.yml 의 "여러 원인에 분산된 급증" 케이스가 이걸 고정한다 — 5개 원인 × 4/분 = 총
      # 20/분). 원인별 분해는 Grafana "냉각 원인별 비율" 패널이 담당한다.
      #
      # 임계값은 reputation_alert_cooling_surge_threshold 게이지에서 읽는다(앱 설정 surge-thresholds).
      #
      # scalar() 를 그냥 쓰지 않고 max() 로 먼저 접는 이유: scalar() 는 입력 벡터가 원소 1개일 때만 값을
      # 내고 2개 이상이면 NaN 을 돌려준다 — 그러면 비교가 조용히 거짓이 되어 알림이 무동작한다. 지금은
      # app 컨테이너가 하나라 시계열도 하나지만, 인스턴스가 늘거나(#85 멀티인스턴스) 롤링 중 두 타깃이
      # 겹치면 인스턴스별 게이지가 생긴다. 그 경우를 absent() 워치독은 잡지 못하므로(있기는 하니까),
      # 인스턴스 수와 무관하게 단일 값이 되도록 집계해 둔다. 모든 인스턴스가 같은 설정을 읽으므로 어떤
      # 집계든 같은 값이고, max() 는 값이 갈릴 때 더 보수적인(늦게 우는) 쪽을 고른다.
      #
      # 좌변도 sum(...) 으로 이미 전역 합산이라, 양변 모두 인스턴스에 무관하다.
      - alert: ResourceCoolingSurge
        expr: >
          sum(rate(reputation_resource_cooled_total[5m])) * 60
          > scalar(max(reputation_alert_cooling_surge_threshold))
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "리소스 냉각 급증 (분당 임계 초과, 최근 5분)"
          description: "원인별 분해는 Grafana '냉각 원인별 비율' 패널에서 확인한다. 임계값은 surge-thresholds.cooling-per-minute."

      # 업스트림 차단 급증 (#77). 위 룰이 원리적으로 볼 수 없는 사건을 위한 별도 룰이다.
      #
      # BLOCKED 의 첫 쿨다운은 7200초(core AdaptiveCooldownPolicy base 3600 × 2^(cool-after-1))라, 한
      # (리소스, 컨텍스트) 짝은 두 시간에 한 번만 이 카운터를 올릴 수 있다. 그래서 낮은 비율조차 "서로
      # 다른 짝 여러 개가 5분 안에 새로 차단됐다"는 뜻이고, 반대로 위 룰의 임계(전체 10/분)는 BLOCKED
      # 에게는 짝 50개에 해당해 한참 늦다 — 전체 합산 룰만 두면 BLOCKED 만 오르는 상황을 놓친다
      # (alerts-test.yml 의 "BLOCKED 만 오르는 급증" 케이스가 이걸 고정한다).
      # core penalty() 도 BLOCKED 을 30.0(SLOW 2.0의 15배)으로 매기고 있어 별도·저임계 취급이 맞다.
      #
      # severity 는 warning 이다: ResourceBlocklistSurge 와 같은 등급이고, 새벽에 받아도 즉시 취할 수
      # 있는 조치가 없다. critical 승격은 통지 채널이 실제로 붙는 #98(on-call 에스컬레이션)에서 판단한다.
      - alert: UpstreamBlockingSurge
        expr: >
          sum(rate(reputation_resource_cooled_total{cause="BLOCKED"}[5m])) * 60
          > scalar(max(reputation_alert_blocking_surge_threshold))
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "업스트림 차단 급증 (BLOCKED 원인 냉각이 분당 임계 초과, 최근 5분)"
          description: "상대가 우리를 차단하기 시작했을 가능성. 임계값은 surge-thresholds.blocking-per-minute."

      # 워치독 (#77): 위 두 룰이 비교 대상으로 쓰는 임계값 게이지가 사라지면, 비교식이 빈 결과/NaN 이
      # 되어 두 알림이 "조용히" 꺼진다 — 깨졌는데 조용한 것이 가장 위험한 실패 모드다. 앱이 부팅 시
      # 무조건 등록하므로(SurgeThresholdMetrics) 이 알림이 켜지는 건 스크레이프가 끊겼거나 메트릭
      # 이름이 바뀐 것이다. 급증 알림 자체보다 먼저 고쳐야 하므로 severity 를 같은 warning 으로 둔다.
      # 체크포인트 신선도 SLO (#80): 저장본이 주기의 3배 넘게 낡은 상태로 5분 지속.
      #
      # 이 앱의 풀 상태는 메모리에 살고 30초마다 통째로 DB 에 저장된다. 저장이 실패해도 메모리로 계속
      # 정상 응답하므로 지연·에러율·도메인 지표가 전혀 움직이지 않는다 — 증상 없는 고장이고, 피해는
      # 재시작하는 순간 그동안의 상태가 사라지며 드러난다. 그래서 관측 대상은 실패 사건이 아니라
      # "메모리와 디스크가 얼마나 벌어졌는가"이고, 그게 이 게이지다.
      #
      # 임계를 숫자로 박지 않고 checkpoint-interval 게이지의 3배로 잡는다 — 주기를 바꾸면 임계도 따라
      # 움직여 두 값이 어긋날 수 없다(#77 에서 새 노브를 만든 것과 다른 판단: 여기는 파생시킬 기준값이
      # 이미 설정에 있다). 3배인 이유: 정상 신선도는 0~1주기를 톱니처럼 오가므로 2배는 그 꼭대기와 너무
      # 가깝고, 3배면 연속 2회 실패를 뜻한다(일시적 DB 끊김 한 번은 조용히 지나간다).
      #
      # scalar(max(...)) 는 #77 리뷰에서 배운 형태다 — 인스턴스가 여러 개면 scalar() 가 NaN 을 돌려주고
      # 알림이 조용히 죽는다.
      - alert: CheckpointStale
        expr: >
          reputation_pool_checkpoint_age_seconds
          > 3 * scalar(max(reputation_pool_checkpoint_interval_seconds))
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "체크포인트가 낡았다 — 재시작 시 상태 손실 위험 (주기의 3배 초과, 5분 지속)"
          description: "메모리는 정상이라 다른 지표는 움직이지 않는다. reputation_pool_checkpoint_failures_total 로 만성 실패인지 확인한다."

      # 리스토어 실패 (#80): 기동 시 어떤 테넌트의 스냅샷을 읽지 못했다.
      #
      # 위 신선도 게이지로는 이걸 볼 수 없다 — 읽기만 실패했고 그 뒤 저장은 성공하므로 신선도는 건강하게
      # 보인다. 그런데 결과는 더 나쁘다: 복원하지 못한 테넌트는 빈 풀로 체크포인트 대상에 남아, 다음
      # 라운드가 그 빈 스냅샷을 정상 저장본 위에 덮어쓴다. 되돌릴 방법이 없다.
      # 카운터는 기동 때만 오르므로 짧은 창으로 증가분을 본다. 덮어쓰기 자체를 막는 것(저장 건너뛰기 등)은
      # 가용성 트레이드오프가 있는 동작 변경이라 별도 이슈로 다룬다 — 여기서는 드러내기만 한다.
      - alert: PoolRestoreFailed
        expr: increase(reputation_pool_restore_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "기동 시 풀 복원 실패 — 해당 테넌트의 저장본이 빈 스냅샷으로 덮어써질 수 있다"

      - alert: SurgeThresholdMetricMissing
        expr: >
          absent(reputation_alert_cooling_surge_threshold)
          or absent(reputation_alert_blocking_surge_threshold)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "급증 알림 임계값 지표가 없다 — ResourceCoolingSurge/UpstreamBlockingSurge 가 무동작 중일 수 있다"
