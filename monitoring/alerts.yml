        annotations:
          summary: "[SLO] 컨트롤 플레인 지연 에러버짓을 3배 속도로 소진 중 — 이 속도면 10일 뒤 소진"
          description: "목표 99%/30일. 1d·2h 창이 모두 소진율 3배를 넘었다 (최근 6h 500ms 초과 요청 5건 이상). 정의와 대응은 docs/engineering/slo.md 참고."
      - alert: HttpLatencyBudgetBurnChronic
