# Alertmanager 라우팅 설정 (#76). Prometheus 는 monitoring/alerts.yml 의 SLO 룰을 평가만 하고, firing
# 알림을 여기로 넘겨(monitoring/prometheus.yml 의 alerting.alertmanagers) grouping/dedup/silence/정비창을
# 맡긴다. 하이브리드 원칙: 즉시성이 중요한 도메인 이벤트(ResourceBlocklisted)는 여전히 in-app
# WebhookAlertNotifier(#45)가 담당하고, SLO성 알림은 전부 이 경로로 온다. 역할 분담은
# monitoring/README.md "알림 라우팅" 참고.
#
# 기본은 무통합(zero integrations) blackhole 이다 — 이 레포의 관례(AlertProperties.enabled 기본
# false, REPUTATION_POOL_ALERTS_ENABLED 기본 false)를 그대로 따른다: 아래 webhook_configs 가 주석
# 상태이므로 실제 webhook URL 없이 `docker compose up` 이 성공하고, 알림은 receiver 에 도달만 하고
# 아무 데도 나가지 않는다(라우팅 자체는 동작하므로 amtool 로 합성 알림을 주입해 도달을 확인할 수 있다).
#
# 실제 webhook 을 붙이는 방법 (운영자):
#   1. REPUTATION_POOL_ALERTMANAGER_WEBHOOK_URL 환경변수(호스트 shell 또는 .env)에 실제 webhook URL 을 설정.
#   2. compose.yaml 의 alertmanager 서비스가 Compose Spec 의 `secrets: <name>: environment:` 소스로
#      그 값을 파일(/run/secrets/alertmanager_webhook_url)로 자동 마운트한다 — 커스텀 entrypoint/
#      envsubst 렌더링이 필요 없다.
#   3. 아래 url_file 이 그 경로를 가리키므로, alertmanager 프로세스가 시작할 때(그리고 SIGHUP/리로드 시)
#      파일에서 URL 을 읽는다. 이 파일(alertmanager.yml) 자체에는 시크릿이 전혀 담기지 않는다.
#   4. 변수가 빈 값이면(로컬 기본) 빈 파일이 마운트된다. webhook_configs 를 켠 상태여도 Alertmanager 는
#      정상 기동하고(로컬 검증: 빈 url_file 로 컨테이너 기동·설정 로드 성공) 통지 POST 만 빈 URL 로
#      실패해 로그에 남는다 — 앱에는 아무 영향이 없다. 즉 "설정 없으면 완전 no-op" 관례를 지킨다.
#      단 변수를 아예 정의하지 않으면(빈 값이 아니라 미정의) compose 가 컨테이너 생성 시점에 하드 실패
#      하므로, .env.example 은 이 변수를 빈 값으로 정의해 둔다(compose.yaml 하단 secrets 주석 참고).
#
# (docker-config-secrets: `environment:` 소스는 Compose Spec 의 최신 기능이며 docker compose v2.24+
# 에서 지원된다. 커스텀 entrypoint/envsubst 방식은 검토했으나 이 방식이 더 단순해 채택했다 — 이유는
# PR 본문 참고.)
# 같은 SLO 안에서 더 급한 소진율 티어가 떠 있으면 덜 급한 티어는 통지하지 않는다 (#79).
#
# 멀티 burn-rate 는 티어가 **의도적으로** 겹친다. 에러율 33% 는 가용성 목표 99.5% 에서 66배 소진이라
# Fast(14.4배)·Medium(6배)·Slow(3배)·Chronic(1배) **네 티어의 임계를 동시에** 넘는다. alertname 이
# 서로 다르므로 route 의 group_by: ['alertname'] 으로는 묶이지 않고 통지가 네 번 나간다 — 그 중 둘은
# critical 이라 page 가 두 번 울린다(#79 리뷰 지적). 사건은 하나이므로 가장 급한 티어만 남긴다.
#
# severity 만으로는 이걸 표현할 수 없다. Fast 와 Medium 은 **둘 다 critical** 이라 등급 비교로는 우열이
# 없다. 그래서 알림마다 tier 라벨을 달고 그 순서(fast > medium > slow > chronic)로 캐스케이드를 만든다.
# Alertmanager 에는 라벨 값의 크기 비교가 없으므로 단계마다 규칙을 하나씩 쓴다.
#
# equal: ['slo'] 로 같은 SLO 안에서만 억제한다 — 데이터 플레인 장애가 컨트롤 플레인 알림을 묻지 않는다.
# tier 라벨이 있는 알림(소진율 16개)만 이 규칙에 걸리므로, 도메인 급증·체크포인트·워치독·TargetDown 은
# 서로도 다른 것도 억제하지 않는다. 이전 초안은 `severity = critical` → `severity = warning` 형태였는데,
# equal 이 **라벨이 양쪽 모두 없을 때도 같다고 보기 때문에** tier/slo 라벨이 없는 TargetDown 이 도메인
# warning 전부를 묻어 버릴 수 있었다. tier 기준으로 바꾸면 그 위험이 구조적으로 사라진다.
inhibit_rules:
  - source_matchers: ['tier = fast']
    target_matchers: ['tier =~ "medium|slow|chronic"']
    equal: ['slo']
  - source_matchers: ['tier = medium']
    target_matchers: ['tier =~ "slow|chronic"']
    equal: ['slo']
  - source_matchers: ['tier = slow']
    target_matchers: ['tier = chronic']
    equal: ['slo']

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

receivers:
  - name: 'default'
    # 기본은 무통합(zero integrations) — 완전히 무해한 blackhole. webhook_configs 를 여기 추가하려면
    # 위 안내대로 REPUTATION_POOL_ALERTMANAGER_WEBHOOK_URL 을 설정하고 아래 주석을 해제한다.
    # webhook_configs:
    #   - url_file: /run/secrets/alertmanager_webhook_url
    #     send_resolved: true
