spring:
  application:
    name: reputation-pool-cloud
  autoconfigure:
    # Spring Security's default in-memory user (with a generated password logged at startup) is
    # meaningless here: the control plane authenticates with a JWT (oauth2 resource server), and gRPC
    # uses its own x-api-key interceptor. Excluding it removes an unused account and a confusing log line.
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${REPUTATION_POOL_DB_URL:jdbc:postgresql://localhost:5435/reputation_pool}
    username: ${REPUTATION_POOL_DB_USERNAME:reputation_pool}
    # No baked-in default: the password must be supplied via REPUTATION_POOL_DB_PASSWORD (empty here
    # so a missing value fails to connect rather than silently using a known password). Local dev sets
    # it to the compose.yaml value; production supplies it from a secret.
    password: ${REPUTATION_POOL_DB_PASSWORD:}
  flyway:
    enabled: true
    # locations default to classpath:db/migration — the reputation-pool-persistence jar ships
    # V1__snapshot.sql and V2__audit.sql there, so the schema is migrated before the store is used.

management:
  endpoints:
    web:
      exposure:
        # prometheus (issue #45) is exposed but NOT public: only health/info are permitAll in
        # SecurityConfiguration, so /actuator/prometheus falls under the authenticated() catch-all and a
        # scraper must present the admin bearer token (fail-closed). Relax to permitAll only behind a
        # trusted network boundary.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  # Opt in to the Prometheus registry explicitly. Exposing the endpoint is not enough on its own: the
  # scrape endpoint only appears once a PrometheusMeterRegistry exists, and that registry is gated on this
  # flag (its @ConditionalOnEnabledMetricsExport falls back to management.defaults.metrics.export.enabled,
  # which is not on here). Setting it directly is the targeted opt-in.
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      # gRPC data-plane SLI (issue #78): net.devh's GrpcServerMetricAutoConfiguration is already active
      # (MeterRegistry + micrometer-core's MetricCollectingServerInterceptor are both on the classpath),
      # so grpc.server.processing.duration is already timing every RPC — it is just missing histogram
      # buckets, so histogram_quantile() over grpc_server_processing_duration_seconds_bucket returns an
      # empty vector. This turns the buckets on for that one timer.
      #
      # http.server.requests is a companion fix, not new scope: monitoring/alerts.yml's HighRequestLatencyP99
      # rule already queries http_server_requests_seconds_bucket, but no bucket config existed anywhere in
      # this repo, so that alert has silently been evaluating to an empty vector (never firing) since it
      # was added. Same root cause, so it is fixed alongside the gRPC timer.
      #
      # Both timers are named explicitly rather than turned on with a wildcard (e.g. `.all: true`): a
      # wildcard would also add buckets to every other timer Spring Boot auto-instruments (JVM, datasource,
      # Hikari, Tomcat, etc.), each one growing the scrape payload and cardinality for no SLO that reads them.
      percentiles-histogram:
        grpc.server.processing.duration: true
        http.server.requests: true
      # Latency SLI boundary (issue #79). The burn-rate rules measure latency as a good/total ratio —
      # "what share of requests finished within 500 ms" — which in PromQL reads a single cumulative bucket:
      # `..._bucket{le="0.5"}`. That series only exists if 500 ms is an actual bucket boundary, and
      # `percentiles-histogram` above does not produce one: with a Timer's default range (1 ms … 30 s) it
      # generates 66 buckets whose nearest neighbours are 0.447392 s and 0.536871 s. Verified by running
      # Micrometer 1.15.1's PercentileHistogramBuckets directly; adding this SLO boundary takes it to 67
      # buckets including exactly 0.5.
      #
      # Without it the ratio's numerator is an empty vector, so the rule evaluates to nothing and the alert
      # can never fire — the same silent failure that left HighRequestLatencyP99 inert before #78 (see the
      # comment above). PrometheusScrapeIT pins the rendered `le="0.5"` label so a regression fails a test
      # rather than quietly disabling an alert.
      #
      # One boundary per timer, not a spread: the only threshold any rule compares against is 500 ms, and
      # each extra boundary is another series per tag combination on every scrape.
      slo:
        grpc.server.processing.duration: 500ms
        http.server.requests: 500ms

server:
  port: ${PORT:8083}
  # Caddy(#15) 뒤에서 X-Forwarded-For / X-Forwarded-* 헤더의 실제 클라이언트 IP를 request.getRemoteAddr()에
  # 반영한다 — 로그인 브루트포스 방어(#28)가 프록시 뒤에서도 진짜 클라이언트 IP로 스로틀하기 위함. 신뢰 경계는
  # 네트워크다: 8083은 Caddy만 접근 가능해야 하며 앱을 외부에 직접 노출하지 말 것. 그렇지 않으면 클라이언트가
  # X-Forwarded-For를 위조해 스로틀을 우회하거나 다른 IP를 덮어씌울 수 있다.
  forward-headers-strategy: framework

grpc:
  server:
    port: ${GRPC_PORT:9093}

# Engine wiring knobs. Defaults mirror the public reputation-pool AdvisorServer composition root.
reputation-pool:
  auth:
    # Single API key seeded for the default tenant on startup (issue #9a). No baked default: unset →
    # nothing is seeded, so the api_key table stays empty and the interceptor rejects all gRPC calls
    # (fail closed). Supply via REPUTATION_POOL_API_KEY; #11 replaces this with per-tenant key mgmt.
    api-key: ${REPUTATION_POOL_API_KEY:}
  # REST control-plane admin login (issue #11). All secrets come from env / a secret manager; no baked
  # defaults. When the signing secret is unset — or no account is fully configured — the admin console is
  # disabled (fail closed): login cannot mint a token and every /api/** call is rejected. The gRPC data
  # plane is unaffected. The jwt-secret must be at least 32 bytes (HS256 needs a 256-bit key); a shorter
  # value fails fast at startup.
  #
  # 아래 username/password/tenant 는 v1 의 단일 관리자 로그인 그대로이고, 의미도 그대로다 — 전권(admin)
  # 계정이며 tenant 가 대시보드 읽기 범위를 정한다. 기존 배포는 이 세 키만 두면 이전과 동일하게 동작한다.
  admin:
    username: ${REPUTATION_POOL_ADMIN_USERNAME:}
    password: ${REPUTATION_POOL_ADMIN_PASSWORD:}
    tenant: ${REPUTATION_POOL_ADMIN_TENANT:default}
    jwt-secret: ${REPUTATION_POOL_ADMIN_JWT_SECRET:}
    token-ttl: ${REPUTATION_POOL_ADMIN_TOKEN_TTL:PT1H}
    # 추가 관리자 계정 + 역할(이슈 #31 1차). 위 단일 계정과 공존한다. username/password 가 비어 있는
    # 항목은 계정 목록에서 버려지므로, 환경변수를 주지 않으면 그 슬롯은 아예 없는 것과 같다 — 읽기 전용
    # 계정을 기본값으로 만들어 두지 않는다. 값은 여기 적지 않고 환경변수로만 주입한다(security.md).
    #
    # role 은 admin | read-only 이며 생략하면 read-only(최소 권한)다. read-only 토큰의 쓰기 거부는
    # 대시보드가 아니라 서버가 강제한다 — AdminWriteAuthorizationFilter 참고.
    #
    # 왜 슬롯을 여기 펼쳐 두나: 이 스택의 설정 전달 경로는 `.env` → compose → **환경변수**인데, Boot 의
    # 환경변수 이완 바인딩은 `reputation-pool` 처럼 하이픈이 든 접두사 아래의 **인덱스 목록**(accounts[0])
    # 까지는 되짚어 주지 않는다(스칼라만 된다 — AdminAuthPropertiesTest 에서 실측). 그래서 슬롯을
    # 레포의 다른 모든 노브와 같은 `${ENV:기본값}` 표기로 미리 펼쳐, 운영자가 다루는 이름이 평범한
    # 환경변수 하나가 되게 한다. 슬롯보다 계정이 더 필요하면 여기에 항목을 추가한다(설정 변경).
    accounts:
      - username: ${REPUTATION_POOL_ADMIN_ACCOUNT_1_USERNAME:}
        password: ${REPUTATION_POOL_ADMIN_ACCOUNT_1_PASSWORD:}
        tenant: ${REPUTATION_POOL_ADMIN_ACCOUNT_1_TENANT:default}
        role: ${REPUTATION_POOL_ADMIN_ACCOUNT_1_ROLE:read-only}
      - username: ${REPUTATION_POOL_ADMIN_ACCOUNT_2_USERNAME:}
        password: ${REPUTATION_POOL_ADMIN_ACCOUNT_2_PASSWORD:}
        tenant: ${REPUTATION_POOL_ADMIN_ACCOUNT_2_TENANT:default}
        role: ${REPUTATION_POOL_ADMIN_ACCOUNT_2_ROLE:read-only}
    # 로그인 브루트포스 방어(#28). POST /api/auth/login을 소스 IP 기준으로 스로틀한다. v1은 단일 admin
    # 계정이라 "계정 잠금"은 self-DoS이므로, 계정이 아니라 IP를 일시 차단한다. L1: window 안에서 max-attempts
    # 실패 시 그 IP를 block-duration 동안 차단(429 + Retry-After), 로그인 성공 시 해당 IP 카운터 리셋.
    # L2: global-max-per-second는 여러 IP 분산 시도에 대한 전역 초당 상한 안전판.
    login-throttle:
      enabled: ${REPUTATION_POOL_ADMIN_LOGIN_THROTTLE_ENABLED:true}
      max-attempts: 5
      window: PT15M
      block-duration: PT15M
      global-max-per-second: 20
  lease-ttl: PT30S
  checkpoint-interval: PT30S
  engine:
    window-size: 10
    cool-after: 2
    recover-after: 2
  audit:
    purge-interval: PT1H
    # Opt-in audit retention (ISO-8601, e.g. P30D). P0D (the default) means never purge — the trail
    # grows unbounded, exactly as the reference does when the knob is unset.
    retention: ${REPUTATION_POOL_AUDIT_RETENTION:P0D}
  # Shared-JVM global resource budget (issue #84). All tenants share one JVM-resident pool, so this
  # bounds the *sum across every tenant* (never a per-tenant cap) — a lone tenant may use the whole
  # budget, several tenants share it dynamically as usage grows. Both defaults are an unmeasured
  # hypothesis (no production load test backs these numbers yet); tune once real memory footprint per
  # resource/cell is observed.
  limits:
    max-resources: ${REPUTATION_POOL_MAX_RESOURCES:100000}
    max-cells: ${REPUTATION_POOL_MAX_CELLS:500000}
  # 도메인 급증 알림 임계값(이슈 #77), 단위는 "분당 전이 건수". monitoring/alerts.yml 의
  # ResourceCoolingSurge / UpstreamBlockingSurge 가 이 값을 게이지 시계열로 읽어 비교한다.
  #
  # 왜 룰 파일이 아니라 여기 있나: Prometheus 는 룰 파일에서 환경변수를 치환하지 않는다. 임계값을
  # alerts.yml 에 숫자로 박으면 파일을 고쳐 리로드하는 것 말고는 바꿀 방법이 없다. 게이지로 노출하면
  # 이 레포의 다른 모든 노브와 같은 경로(환경변수)로 조정되고, 값이 Prometheus 에 보여서 Grafana 에서
  # 실제 냉각율과 임계선을 같은 패널에 겹쳐 볼 수 있다(남은 여유를 눈으로 확인할 수 있다).
  #
  # 두 기본값은 limits 와 마찬가지로 실측 없는 가설이다 — 아직 프로덕션 트래픽이 없다. 다만 둘의
  # "비율"은 감이 아니라 도출된 값이다: 한 (리소스, 컨텍스트) 짝은 쿨다운이 끝나기 전에는 다시 냉각
  # 이벤트를 내지 않고(core ReputationEngine.shouldCool), 첫 쿨다운은 base(cause) × 2^(cool-after-1)
  # 이라 cool-after=2 에서 SLOW 는 60초·BLOCKED 는 7200초 — 120배 차이다. 그래서 같은 "분당 N건"이
  # 전체 합산에서는 "만성적으로 느린 짝 몇 개", BLOCKED 에서는 "서로 다른 짝 수십 개가 새로 차단"을
  # 뜻하므로 blocking 임계가 한 자릿수 낮다. cooling 은 기존 ResourceBlocklistSurge 의 10/분에 맞췄다.
  #
  # 실측 후 조정법(평상시 대비 배수로 잡는다)은 monitoring/README.md "급증 임계값 조정" 참고.
  # 0 이나 음수는 부팅 시 거부한다 — 룰을 끄려면 alerts.yml 에서 룰을 지운다.
  surge-thresholds:
    cooling-per-minute: ${REPUTATION_POOL_COOLING_SURGE_THRESHOLD:10}
    blocking-per-minute: ${REPUTATION_POOL_BLOCKING_SURGE_THRESHOLD:1}
  # 상태 전이 알림 MVP(이슈 #45, A 조각). 리소스가 BLOCKLISTED로 전이하면 운영자가 대시보드를 보고 있지
  # 않아도 webhook 알림을 받는다. opt-in·fail-safe: enabled=false 또는 webhook-url이 비어 있으면 완전
  # no-op이라 아무것도 전송하지 않는다(둘 다 설정해야 발동). 전송은 엔진 핫패스를 막지 않도록 별도 스레드에서
  # fire-and-forget이며, 실패는 삼켜 로깅만 한다. 페이로드에는 kind/value·eventType·시각만 담고 비밀값은 넣지
  # 않는다. 메일 채널·COOLING 급증 감지·메트릭 노출은 후속(메트릭은 core observability 포트 선행 필요).
  alerts:
    enabled: ${REPUTATION_POOL_ALERTS_ENABLED:false}
    webhook-url: ${REPUTATION_POOL_ALERTS_WEBHOOK_URL:}
    timeout: ${REPUTATION_POOL_ALERTS_TIMEOUT:PT2S}
  # 읽기 전용 시연용 데모 테넌트. 기본 꺼짐 — enabled=true 로 명시적으로 켤 때만 동작하며, 켜져 있어도
  # `tenant` 하나의 범위(tenant_id / pool_id) 밖으로는 한 줄도 쓰지 않는다. 이미 존재하는데 데모 시더가
  # 만든 테넌트가 아니면 덮어쓰지 않고 건너뛴다(오타로 실 테넌트를 지우는 사고 방지).
  #
  # 재기동하면 같은 시드로 같은 데이터를 다시 써 넣는다(멱등) — 행이 불어나지 않고, 시각만 현재로
  # 다시 맞춰져 데모가 낡지 않는다. 실제 운영 테넌트에는 켜지 말 것.
  demo:
    enabled: ${REPUTATION_POOL_DEMO_ENABLED:false}
    tenant: ${REPUTATION_POOL_DEMO_TENANT:demo}
    resources: ${REPUTATION_POOL_DEMO_RESOURCES:36}
    history: ${REPUTATION_POOL_DEMO_HISTORY:PT48H}
    steps: ${REPUTATION_POOL_DEMO_STEPS:96}
    usage-days: ${REPUTATION_POOL_DEMO_USAGE_DAYS:30}
