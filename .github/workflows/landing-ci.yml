# 랜딩·문서(#15/#16) CI — `landing/` 변경 시에만 돈다.
#
# 대시보드 CI(dashboard-ci.yml)와 별개인 이유는 두 앱이 별개 배포 대상이기 때문이다. 랜딩은
# Cloudflare Pages 로, 대시보드는 GHCR 이미지 → 서버로 나간다. 한쪽 변경이 다른 쪽 CI 를 돌릴 이유가
# 없고, 무엇보다 **랜딩이 깨져도 서버 배포가 막히면 안 된다**(그 반대도 마찬가지다).
#
# e2e/visual 은 여기 없다. 랜딩은 정적 HTML 이고 상호작용이 언어 스위처·테마 토글뿐이라 jsdom 으로
# 충분하다. 실브라우저가 필요해지면 그때 추가한다.
name: Landing CI

on:
  push:
    branches: [ main ]
    paths:
      - "landing/**"
      - ".github/workflows/landing-ci.yml"
  pull_request:
    paths:
      - "landing/**"
      - ".github/workflows/landing-ci.yml"

concurrency:
  group: landing-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: landing

jobs:
  gate:
    name: Typecheck / Lint / Vitest / Export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: corepack pnpm typecheck

      - name: Lint
        run: corepack pnpm lint

      - name: Unit tests (vitest)
        run: corepack pnpm test

      - name: Static export (next build)
        run: corepack pnpm build

      # 정적 내보내기가 **실제로 파일을 만들었는지** 확인한다. `next build` 는 export 설정이 빠져도
      # 성공하므로(그때는 `.next/` 만 생긴다) 빌드 성공만으로는 Pages 에 올릴 것이 있다는 보장이 없다.
      # 그 경우 배포는 조용히 빈 사이트를 만든다.
      - name: 내보내기 산출물 확인
        run: |
          test -f out/index.html || { echo "out/index.html 이 없다 — output: 'export' 설정을 확인한다" >&2; exit 1; }
          echo "생성된 HTML:"; find out -name '*.html' | sort
