# 배포 이미지 발행 (#15 / D8) — app·dashboard 를 GHCR 에 멀티아치(arm64 + amd64)로 푸시한다.
#
# 왜 CI 에서 빌드하고 서버는 pull 만 하나: 무료 티어 배포 타깃이 Oracle A1(2 OCPU)이라 서버에서 Gradle
# `bootJar` + `next build` 를 돌리면 코어를 수 분간 점유하고 빌드 중 서비스 메모리와 경쟁한다. 빌드
# 산출물만 내려받으면 재배포가 `compose pull && up -d` 로 끝난다.
#
# 왜 두 아키텍처인가: 초판은 arm64 만 발행했다("amd64 이미지의 소비자가 없다"). 그 전제가 깨졌다 —
# 도쿄 리전 A1 용량이 계속 확보되지 않아, 체험 크레딧으로 x86 인스턴스에 먼저 올리는 경로가 필요해졌다.
# 아키텍처가 갈려도 **배포 경로는 하나여야** 한다(서버는 언제나 pull 만 한다). 그래서 매니페스트 리스트
# 하나로 묶어 `:latest` 가 두 아키텍처를 모두 가리키게 한다 — compose 파일은 손대지 않는다.
#
# 러너는 각 아키텍처의 네이티브 호스티드 러너를 쓴다(public 레포는 arm64 러너도 무료). QEMU 에뮬레이션
# 으로 교차 빌드하면 JVM/Node 빌드가 수 배 느려진다.
#
# 발행 구조:
#   build  잡: 이미지 × 플랫폼 = 4개 병렬. 아키텍처 접미 태그(`:latest-arm64` 등)로 푸시한다.
#   merge  잡: 접미 태그들을 `docker buildx imagetools create` 로 묶어 `:latest`·`:sha-<커밋>` 을 만든다.
# 접미 태그를 경유하는 이유: digest 를 잡 사이로 넘기려면 아티팩트 업/다운로드가 필요한데, 태그를 쓰면
# 그 왕복이 사라진다. 접미 태그가 패키지 목록에 남는 건 감수한다(어느 아키텍처가 언제 구워졌는지 보인다).
name: Release Images

on:
  push:
    branches: [ main ]
  # 코드 변경 없이 이미지를 다시 굽고 싶을 때(베이스 이미지 보안 패치 반영 등).
  workflow_dispatch:

# 발행 도중 취소하면 태그가 반쯤 갱신된 상태로 남을 수 있어 cancel-in-progress 를 쓰지 않는다.
concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }} → ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # 한쪽이 깨져도 나머지는 발행한다(독립 이미지/아키텍처다). merge 잡이 빠진 아키텍처를 걸러낸다.
      fail-fast: false
      matrix:
        include:
          - image: app
            context: .
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: app
            context: .
            arch: amd64
            runner: ubuntu-latest
          - image: dashboard
            context: ./dashboard
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: dashboard
            context: ./dashboard
            arch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 이미지 이름을 소문자로 직접 적는다: GHCR 은 대문자 경로를 거부하는데 `github.repository` 는
      # `PreAgile/...` 라 그대로 쓰면 실패한다. compose.prod.yaml 이 같은 문자열을 참조하므로 두 파일을
      # 함께 고쳐야 한다.
      - name: Build & push (arch-suffixed)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ghcr.io/preagile/reputation-pool-cloud/${{ matrix.image }}:latest-${{ matrix.arch }}
            ghcr.io/preagile/reputation-pool-cloud/${{ matrix.image }}:sha-${{ github.sha }}-${{ matrix.arch }}
          # 레이어 캐시로 Gradle 의존성·pnpm store 재다운로드를 피한다. 아키텍처별로 분리해야
          # 서로의 캐시를 무효화하지 않는다.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

  # 아키텍처별 태그를 매니페스트 리스트로 묶는다. 이 잡이 끝나야 서버가 `:latest` 를 pull 할 수 있다.
  merge:
    name: ${{ matrix.image }} → manifest
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ app, dashboard ]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        env:
          IMAGE: ghcr.io/preagile/reputation-pool-cloud/${{ matrix.image }}
          SHA: ${{ github.sha }}
        run: |
          short="${SHA:0:7}"
          # build 잡이 fail-fast 없이 도므로 한 아키텍처가 빠질 수 있다. 실제로 올라간 것만 묶는다 —
          # 없는 태그를 넣으면 imagetools 가 실패해 멀쩡한 아키텍처까지 발행되지 않는다.
          sources=()
          for arch in arm64 amd64; do
            if docker manifest inspect "${IMAGE}:latest-${arch}" > /dev/null 2>&1; then
              sources+=("${IMAGE}:latest-${arch}")
            else
              echo "::warning::${IMAGE}:latest-${arch} 가 없다 — 이 아키텍처를 매니페스트에서 제외한다"
            fi
          done
          [ ${#sources[@]} -gt 0 ] || { echo "발행된 아키텍처가 없다" >&2; exit 1; }

          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:sha-${short}" \
            "${sources[@]}"

          echo "발행된 매니페스트:"
          docker buildx imagetools inspect "${IMAGE}:latest"
