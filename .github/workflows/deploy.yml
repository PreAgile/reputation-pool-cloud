# 프로덕션 자동 배포 (#15 / D8) — main 머지 → 이미지 발행 완료 → 서버 반영까지 자동으로 잇는다.
#
# 지금까지의 공백: release.yml 이 GHCR 에 이미지를 굽고, 서버의 scripts/bootstrap.sh 가 pull 해서 띄우는
# 두 조각은 있었지만 **그 사이를 사람이 SSH 로 이어야** 했다. 그래서 main 에 머지된 변경이 프로덕션에
# 반영되지 않은 채 남는 일이 생겼다(랜딩 수정 #109 가 그랬다).
#
# 왜 push 기반(Actions → SSH → bootstrap.sh)인가:
#   * bootstrap.sh 가 이미 멱등하다("재실행이 곧 재배포"). 원격에서 한 번 호출하는 것이 배포의 전부다.
#   * 배포 시점이 명확하다 — 어느 커밋이 언제 올라갔는지 Actions 로그에 남는다. pull 기반(서버 에이전트가
#     레지스트리를 폴링)은 시크릿을 서버 밖으로 내보내지 않는 대신 그 관측성을 잃는다.
#   * 롤백이 같은 경로를 탄다(아래 workflow_dispatch).
#
# 왜 release.yml 에 잡을 붙이지 않고 별도 워크플로인가: 롤백은 "이미지를 다시 굽지 않고 과거 커밋을
# 배포"하는 동작이다. release.yml 안에 두면 롤백이 항상 재빌드를 끌고 온다.
#
# 왜 workflow_run 트리거인가: push 로 직접 걸면 이미지 발행과 배포가 경쟁한다 — 아직 GHCR 에 없는 태그를
# pull 하려다 실패할 수 있다. Release Images 의 성공을 기다려야 순서가 보장된다.
name: Deploy to production

on:
  workflow_run:
    workflows: ["Release Images"]
    types: [completed]
    branches: [main]
  # 롤백·수동 재배포. sha 를 비우면 main 최신을 배포한다.
  workflow_dispatch:
    inputs:
      sha:
        description: "배포할 커밋 SHA (비우면 main 최신). 롤백은 과거 SHA 를 넣는다."
        required: false
        type: string

# 배포는 중간에 끊으면 반쯤 갱신된 스택이 남으므로 cancel-in-progress 를 쓰지 않는다.
# 그룹을 ref 로 나누지 않는 이유: 프로덕션 호스트는 하나뿐이라 동시 배포 자체가 없어야 한다.
concurrency:
  group: deploy-production

permissions:
  contents: read

jobs:
  deploy:
    name: SSH → bootstrap.sh
    runs-on: ubuntu-latest
    # 발행이 실패했으면 배포하지 않는다(workflow_dispatch 는 이 조건과 무관하게 통과).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # GitHub Environment. 여기에 required reviewers 를 걸면 워크플로를 고치지 않고도 배포에 승인 게이트를
    # 넣을 수 있다(설정 → Environments → production). 지금은 게이트 없이 통과한다.
    environment: production
    steps:
      # 배포 시크릿이 아직 없는 저장소에서 머지마다 빨간 X 가 뜨는 것을 막는다 — 이 레포의 관례와 같다
      # (REPUTATION_POOL_ALERTS_ENABLED 기본 false, alertmanager 무통합 blackhole: 설정이 없으면 no-op).
      # 실패가 아니라 "건너뜀"으로 끝나므로, 설정 전에는 아무 소음도 만들지 않는다.
      - name: 배포 설정 여부 확인
        id: gate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          missing=()
          [ -n "$DEPLOY_HOST" ] || missing+=(DEPLOY_HOST)
          [ -n "$DEPLOY_USER" ] || missing+=(DEPLOY_USER)
          [ -n "$DEPLOY_SSH_KEY" ] || missing+=(DEPLOY_SSH_KEY)
          [ -n "$DEPLOY_SSH_KNOWN_HOSTS" ] || missing+=(DEPLOY_SSH_KNOWN_HOSTS)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### 배포를 건너뛴다"
              echo
              echo "다음 시크릿이 없다: \`${missing[*]}\`"
              echo
              echo "설정 방법은 \`docs/engineering/deployment.md\` 의 \"자동 배포\" 절 참고."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "배포 시크릿 미설정(${missing[*]}) — 건너뛴다"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # 배포 대상 커밋. workflow_run 은 발행을 유발한 커밋을, dispatch 는 입력값(없으면 main)을 쓴다.
      # `latest` 가 아니라 커밋을 고정하는 이유는 아래 "이미지 태그" 주석 참고.
      - name: 배포 대상 커밋 결정
        id: target
        if: steps.gate.outputs.ready == 'true'
        env:
          INPUT_SHA: ${{ inputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha="${INPUT_SHA:-$RUN_SHA}"
          if [ -z "$sha" ]; then
            # workflow_dispatch 에 입력이 없고 workflow_run 도 아닌 경우 — 이 워크플로 파일의 ref 를 쓴다.
            sha="${GITHUB_SHA}"
          fi
          case "$sha" in
            *[!0-9a-fA-F]* | "") echo "SHA 형식이 아니다: $sha" >&2; exit 1 ;;
          esac
          [ ${#sha} -ge 7 ] || { echo "SHA 가 너무 짧다: $sha" >&2; exit 1; }
          # 이미지 태그용 7자리. release.yml 의 merge 잡이 매니페스트를 sha-${SHA:0:7} 로 발행하므로
          # 여기서도 같은 길이를 써야 한다(40자리는 아치별 단일 이미지 태그이고 매니페스트가 아니다).
          short="${sha:0:7}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "배포 대상: $sha (이미지 태그 sha-$short)"

      # 존재하지 않는 태그를 pull 하려다 서버에서 실패하는 것보다, 여기서 먼저 막는 편이 원인이 분명하다.
      # 실제로 이 워크플로의 첫 리뷰에서 잡힌 결함이 정확히 이것이었다(40자리 태그 요청 → 매니페스트 없음).
      # GHCR 패키지는 public 이라 익명으로 조회된다.
      - name: 배포할 이미지 태그가 실제로 발행됐는지 확인
        if: steps.gate.outputs.ready == 'true'
        env:
          TAG: sha-${{ steps.target.outputs.short }}
        run: |
          missing=()
          for image in app dashboard; do
            ref="ghcr.io/preagile/reputation-pool-cloud/${image}:${TAG}"
            if docker manifest inspect "$ref" > /dev/null 2>&1; then
              echo "ok: $ref"
            else
              missing+=("$ref")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "다음 이미지가 GHCR 에 없다:" >&2
            printf '  %s\n' "${missing[@]}" >&2
            echo "release.yml 의 merge 잡이 이 커밋에 대해 성공했는지, 패키지가 public 인지 확인한다." >&2
            exit 1
          fi

      - name: SSH 준비
        if: steps.gate.outputs.ready == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # known_hosts 를 반드시 요구한다. StrictHostKeyChecking=no 로 넘기면 중간자가 끼어들어도
          # 그대로 배포 명령을 넘겨준다 — 배포 키를 쥔 세션이라 대가가 크다.
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 실제 배포. 서버의 체크아웃을 대상 커밋으로 맞추고 bootstrap.sh 를 부른다.
      #
      # 왜 이미지 pull 만으로 끝나지 않나: compose 파일·monitoring/*(alerts.yml 등)·Caddyfile.prod 는
      # 이미지 안이 아니라 **서버의 체크아웃에서 bind-mount** 된다. 이미지만 갱신하면 알림 룰이나 리버스
      # 프록시 설정 변경이 반영되지 않는다. 그래서 체크아웃도 같은 커밋으로 맞춘다.
      #
      # 이미지 태그: `latest` 대신 커밋에 고정한다. `latest` 는 이 배포가 도는 사이 다음 머지로 옮겨갈 수
      # 있어, 체크아웃 커밋과 실행 이미지가 서로 다른 조합이 될 수 있다.
      #
      # **태그는 7자리 짧은 SHA 다.** release.yml 의 merge 잡이 매니페스트 리스트를 `sha-${SHA:0:7}` 로
      # 발행한다(40자리 `sha-<full>-<arch>` 는 아치별 단일 이미지 태그이고 compose 가 쓸 대상이 아니다).
      # 여기서 40자리를 요청하면 존재하지 않는 매니페스트를 pull 하려다 실패한다. git reset 에는 전체 SHA 를
      # 그대로 쓴다(더 정확하고, git 은 짧은 것도 받는다).
      #
      # **환경변수로 넘기지 않고 .env 에 기록한다.** bootstrap.sh 는 도커 그룹이 이번 세션에 아직 반영되지
      # 않았으면 `DOCKER=(sudo docker)` 로 실행하는데, sudo 는 기본 env_reset 이라 export 한 변수를 버린다 —
      # 그러면 compose 가 `${APP_IMAGE_TAG:-latest}` 의 기본값으로 떨어져 "체크아웃은 대상 커밋인데 이미지는
      # latest" 인 조합이 조용히 만들어진다. compose 는 프로젝트 디렉터리의 .env 를 sudo 와 무관하게 직접
      # 읽으므로 그쪽이 안전하다. 이 레포가 이미 문서화한 고정·롤백 방식과도 같다(.env.example 의
      # APP_IMAGE_TAG 주석). 부수 효과로, 나중에 서버에서 bootstrap.sh 를 수동 재실행해도 같은 이미지가 뜬다.
      - name: 원격 배포
        if: steps.gate.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/reputation-pool-cloud' }}
          SHA: ${{ steps.target.outputs.sha }}
          SHORT: ${{ steps.target.outputs.short }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "DEPLOY_PATH='$DEPLOY_PATH' TARGET_SHA='$SHA' IMAGE_TAG='sha-$SHORT' bash -euo pipefail -s" <<'REMOTE'
          cd "${DEPLOY_PATH/#\~/$HOME}"
          echo "==> 체크아웃을 $TARGET_SHA 로 맞춘다"
          git fetch --prune --quiet origin
          # reset --hard 로 서버의 로컬 수정을 버린다 — 배포 대상은 항상 레포의 그 커밋이어야 한다.
          # .env 는 gitignore 대상이라 이 명령에 지워지지 않는다(시크릿은 그대로 남는다).
          git reset --hard --quiet "$TARGET_SHA"
          git --no-pager log -1 --oneline

          # .env 의 키를 멱등하게 갱신한다(있으면 교체, 없으면 추가). 값은 sha-<7자리> 라 sed 구분자와
          # 충돌하지 않는다. 파일이 개행으로 끝나지 않는 경우를 대비해 추가 전에 개행을 보장한다.
          set_env_key() {
            local key="$1" val="$2"
            if grep -qE "^${key}=" .env; then
              sed -i.bak "s|^${key}=.*|${key}=${val}|" .env && rm -f .env.bak
            else
              [ -s .env ] && [ "$(tail -c 1 .env)" != "" ] && printf '\n' >> .env
              printf '%s=%s\n' "$key" "$val" >> .env
            fi
          }
          echo "==> 이미지 태그를 .env 에 고정: $IMAGE_TAG"
          set_env_key APP_IMAGE_TAG "$IMAGE_TAG"
          set_env_key DASHBOARD_IMAGE_TAG "$IMAGE_TAG"
          grep -E '^(APP|DASHBOARD)_IMAGE_TAG=' .env

          echo "==> bootstrap.sh"
          # 오버레이(TLS·6GB 등)는 서버 .env 의 DEPLOY_OVERLAYS 가 정한다 — 모드는 호스트의 성질이므로
          # CI 가 결정하지 않는다. bootstrap.sh 가 그 값을 읽고, 빠지면 다운그레이드 가드가 막는다.
          ./scripts/bootstrap.sh
          REMOTE

      # bootstrap.sh 는 이미 127.0.0.1:8083 헬스를 기다리고 실패하면 죽는다. 여기서는 **공개 경로**를
      # 확인한다 — Caddy·DNS·인증서까지 살아 있는지는 서버 안에서 알 수 없다. URL 이 설정되지 않은
      # 호스트(평문 모드·도메인 없음)에서는 건너뛴다.
      - name: 공개 경로 헬스 확인
        if: steps.gate.outputs.ready == 'true' && vars.DEPLOY_HEALTH_URL != ''
        env:
          URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "$URL" > /dev/null 2>&1; then
              echo "ok: $URL 응답 200"
              exit 0
            fi
            echo "대기 중... ($i/12)"
            sleep 5
          done
          echo "공개 경로가 응답하지 않는다: $URL" >&2
          echo "서버 안 헬스는 통과했으므로 앱은 떴다 — Caddy·DNS·인증서 경로를 확인한다." >&2
          exit 1

      - name: 배포 요약
        if: steps.gate.outputs.ready == 'true'
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          {
            echo "### 배포 완료"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| 커밋 | \`$SHA\` |"
            echo "| 이미지 | \`sha-$SHA\` (app·dashboard) |"
            echo
            echo "롤백: 이 워크플로를 **Run workflow** 로 실행하고 \`sha\` 에 되돌릴 커밋을 넣는다."
          } >> "$GITHUB_STEP_SUMMARY"
