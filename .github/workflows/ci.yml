name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel an in-progress run when a new push lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # build gates everything at once: spotlessCheck (format) + the context-load smoke test. The
      # test excludes the DataSource/Flyway auto-configuration, so this gate needs no database.
      - name: Build, Format check & Test
        run: ./gradlew build --no-daemon

  # Deploy artefacts (#15) are only exercised on the server, so nothing else would catch a typo in them
  # until a bring-up fails. These checks are static and cheap — no stack is started.
  deploy-config:
    name: Deploy config (compose overlay / Caddyfile / scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Parses compose.yaml + compose.prod.yaml together and resolves the !override/!reset tags. Values
      # here are throwaways that only satisfy the required-variable guards; nothing is started.
      - name: Validate prod compose overlay
        env:
          REPUTATION_POOL_API_KEY: ci-config-check
          GRAFANA_ADMIN_PASSWORD: ci-config-check
          DOMAIN: app.example.invalid
          ACME_EMAIL: ci@example.invalid
        run: docker compose -f compose.yaml -f compose.prod.yaml config -q

      # The 6GB profile is only used on a downsized host, so a typo in it would surface as a failed
      # bring-up there. Also asserts its total stays under the host it exists for.
      - name: Validate 6GB overlay
        env:
          REPUTATION_POOL_API_KEY: ci-config-check
          GRAFANA_ADMIN_PASSWORD: ci-config-check
          DOMAIN: app.example.invalid
          ACME_EMAIL: ci@example.invalid
        run: |
          config="$(docker compose -f compose.yaml -f compose.prod.yaml -f compose.prod.6gb.yaml config)"
          total=$(grep -oE 'memory: "[0-9]+"' <<< "$config" | grep -oE '[0-9]+' | paste -sd+ - | bc)
          echo "메모리 상한 합계: $((total / 1024 / 1024)) MiB"
          # 6GB 호스트에서 OS·페이지 캐시 몫을 남겨야 한다. 5GiB 를 넘으면 프로파일이 무의미해진다.
          [ "$total" -le $((5 * 1024 * 1024 * 1024)) ] \
            || { echo "6GB 프로파일 합계가 5GiB 를 넘는다" >&2; exit 1; }

      # Asserts the overlay actually closed the two openings it exists to close: Postgres must not be
      # published, and Caddy must serve Caddyfile.prod (not the plaintext base Caddyfile). A silent
      # list-merge regression (Compose < 2.24 semantics) would leave both in place.
      - name: Assert overlay closes base's dev exposures
        env:
          REPUTATION_POOL_API_KEY: ci-config-check
          GRAFANA_ADMIN_PASSWORD: ci-config-check
          DOMAIN: app.example.invalid
          ACME_EMAIL: ci@example.invalid
        run: |
          config="$(docker compose -f compose.yaml -f compose.prod.yaml config)"
          if grep -q '5435' <<< "$config"; then
            echo "db 의 호스트 포트(5435)가 프로덕션 설정에 남아 있다" >&2; exit 1
          fi
          if grep -qE 'source: .*/Caddyfile$' <<< "$config"; then
            echo "base Caddyfile(평문 :80)이 프로덕션 설정에 마운트되어 있다" >&2; exit 1
          fi
          grep -qE 'source: .*/Caddyfile\.prod$' <<< "$config" \
            || { echo "Caddyfile.prod 마운트가 없다" >&2; exit 1; }
          echo "ok: 5435 미공개 + Caddyfile.prod 마운트"

      # Every service must carry a memory limit and log rotation. Adding a service to the base
      # compose.yaml without adding it here leaves that one container unbounded on the deploy host and
      # its logs growing until the boot volume fills. This drift is silent — it caught us once already
      # (#76's alertmanager landed on main while the overlay was in review).
      - name: Assert every service is bounded
        env:
          REPUTATION_POOL_API_KEY: ci-config-check
          GRAFANA_ADMIN_PASSWORD: ci-config-check
          REPUTATION_POOL_ALERTMANAGER_WEBHOOK_URL: ""
          DOMAIN: app.example.invalid
          ACME_EMAIL: ci@example.invalid
        run: |
          docker compose -f compose.yaml -f compose.prod.yaml config --format json > /tmp/prod.json
          python3 - <<'PY'
          import json, sys
          services = json.load(open('/tmp/prod.json'))['services']
          no_limit = sorted(n for n, s in services.items()
                            if not s.get('deploy', {}).get('resources', {}).get('limits', {}).get('memory'))
          no_logging = sorted(n for n, s in services.items() if not s.get('logging'))
          for label, bad in (('메모리 상한 없음', no_limit), ('로그 회전 없음', no_logging)):
              if bad:
                  print(f'{label}: {", ".join(bad)} — compose.prod.yaml 에 추가할 것', file=sys.stderr)
          if no_limit or no_logging:
              sys.exit(1)
          print(f'ok: 서비스 {len(services)}개 전부 상한·로그 회전 있음')
          PY

      # Adapts the Caddyfile and checks the resulting config. `validate` does not touch the network, so
      # no certificate is requested for the placeholder domain.
      - name: Validate Caddyfile.prod
        run: |
          docker run --rm \
            -e DOMAIN=app.example.invalid -e ACME_EMAIL=ci@example.invalid \
            -v "$PWD/Caddyfile.prod:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile

      # bootstrap.sh runs as root on a public host — an unquoted expansion there is not a style issue.
      #
      # Pinned to an image rather than the runner's preinstalled shellcheck: the runner image's version
      # moves on its own schedule, so the same script can pass locally and fail here (it did — the two
      # versions disagreed on SC2015). Pinning makes local and CI report identically; bump deliberately.
      - name: Shellcheck deploy scripts
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            scripts/bootstrap.sh scripts/oci-launch-retry.sh scripts/backup.sh scripts/restore.sh
