name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel an in-progress run when a new push lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # build gates everything at once: spotlessCheck (format) + the context-load smoke test. The
      # test excludes the DataSource/Flyway auto-configuration, so this gate needs no database.
      - name: Build, Format check & Test
        run: ./gradlew build --no-daemon

  # Deploy artefacts (#15) are only exercised on the server, so nothing else would catch a typo in them
  # until a bring-up fails. These checks are static and cheap — no stack is started.
  deploy-config:
    name: Deploy config (compose overlay / Caddyfile / scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Both deploy modes must parse: plaintext (no domain yet) and TLS. Values here are throwaways that
      # only satisfy the required-variable guards; nothing is started.
      #
      # The plaintext parse deliberately runs with DOMAIN/ACME_EMAIL *unset* — that is the whole point of
      # splitting the TLS overlay out, and setting them here would hide a regression that reintroduces
      # the requirement into compose.prod.yaml.
      - name: Validate prod compose overlay (plaintext, no domain)
        env:
          REPUTATION_POOL_API_KEY: ci-config-check
          GRAFANA_ADMIN_PASSWORD: ci-config-check
        run: docker compose -f compose.yaml -f compose.prod.yaml config -q

      - name: Validate TLS overlay
        env:
          REPUTATION_POOL_API_KEY: ci-config-check
          GRAFANA_ADMIN_PASSWORD: ci-config-check
          DOMAIN: app.example.invalid
          ACME_EMAIL: ci@example.invalid
        run: docker compose -f compose.yaml -f compose.prod.yaml -f compose.prod.tls.yaml config -q

      # The TLS overlay must fail closed when the domain is missing — otherwise Caddy boots with an empty
      # site address and the symptom shows up as an unexplained certificate failure.
      - name: Assert TLS overlay requires DOMAIN
        env:
          REPUTATION_POOL_API_KEY: ci-config-check
          GRAFANA_ADMIN_PASSWORD: ci-config-check
        run: |
          if docker compose -f compose.yaml -f compose.prod.yaml -f compose.prod.tls.yaml config -q 2>/dev/null; then
            echo "DOMAIN 없이도 TLS 오버레이가 통과한다 — fail-fast 가 사라졌다" >&2; exit 1
          fi
          echo "ok: DOMAIN 미설정 시 TLS 오버레이가 거부된다"

      # The 6GB profile is only used on a downsized host, so a typo in it would surface as a failed
      # bring-up there. Also asserts its total stays under the host it exists for.
      - name: Validate 6GB overlay
        env:
          REPUTATION_POOL_API_KEY: ci-config-check
          GRAFANA_ADMIN_PASSWORD: ci-config-check
        run: |
          config="$(docker compose -f compose.yaml -f compose.prod.yaml -f compose.prod.6gb.yaml config)"
          total=$(grep -oE 'memory: "[0-9]+"' <<< "$config" | grep -oE '[0-9]+' | paste -sd+ - | bc)
          echo "메모리 상한 합계: $((total / 1024 / 1024)) MiB"
          # 6GB 호스트에서 OS·페이지 캐시 몫을 남겨야 한다. 5GiB 를 넘으면 프로파일이 무의미해진다.
          [ "$total" -le $((5 * 1024 * 1024 * 1024)) ] \
            || { echo "6GB 프로파일 합계가 5GiB 를 넘는다" >&2; exit 1; }

      # Postgres must never be published on a deploy host — base publishes 5435 on 0.0.0.0 for local
      # convenience. A silent list-merge regression (Compose < 2.24 semantics) would leave it in place.
      # Also pins which Caddyfile each mode mounts: swapping them would either serve plaintext on a
      # domain (no TLS) or hand Caddy a site address it cannot resolve.
      - name: Assert overlay closes base's dev exposures
        env:
          REPUTATION_POOL_API_KEY: ci-config-check
          GRAFANA_ADMIN_PASSWORD: ci-config-check
        run: |
          plain="$(docker compose -f compose.yaml -f compose.prod.yaml config)"
          tls="$(DOMAIN=app.example.invalid ACME_EMAIL=ci@example.invalid \
            docker compose -f compose.yaml -f compose.prod.yaml -f compose.prod.tls.yaml config)"

          for mode in plain tls; do
            eval "config=\$$mode"
            grep -q '5435' <<< "$config" \
              && { echo "[$mode] db 의 호스트 포트(5435)가 남아 있다" >&2; exit 1; }
          done

          grep -qE 'source: .*/Caddyfile$' <<< "$plain" \
            || { echo "[plain] base Caddyfile 마운트가 없다" >&2; exit 1; }
          grep -qE 'source: .*/Caddyfile\.prod$' <<< "$tls" \
            || { echo "[tls] Caddyfile.prod 마운트가 없다" >&2; exit 1; }
          grep -qE 'source: .*/Caddyfile\.prod$' <<< "$plain" \
            && { echo "[plain] TLS 용 Caddyfile.prod 가 붙었다 — 도메인 없이는 뜨지 않는다" >&2; exit 1; }

          echo "ok: 두 모드 모두 5435 미공개, Caddyfile 매핑 정상"

      # Every service must carry a memory limit and log rotation. Adding a service to the base
      # compose.yaml without adding it here leaves that one container unbounded on the deploy host and
      # its logs growing until the boot volume fills. This drift is silent — it caught us once already
      # (#76's alertmanager landed on main while the overlay was in review).
      - name: Assert every service is bounded
        env:
          REPUTATION_POOL_API_KEY: ci-config-check
          GRAFANA_ADMIN_PASSWORD: ci-config-check
          REPUTATION_POOL_ALERTMANAGER_WEBHOOK_URL: ""
        run: |
          docker compose -f compose.yaml -f compose.prod.yaml config --format json > /tmp/prod.json
          python3 - <<'PY'
          import json, sys
          services = json.load(open('/tmp/prod.json'))['services']
          no_limit = sorted(n for n, s in services.items()
                            if not s.get('deploy', {}).get('resources', {}).get('limits', {}).get('memory'))
          no_logging = sorted(n for n, s in services.items() if not s.get('logging'))
          for label, bad in (('메모리 상한 없음', no_limit), ('로그 회전 없음', no_logging)):
              if bad:
                  print(f'{label}: {", ".join(bad)} — compose.prod.yaml 에 추가할 것', file=sys.stderr)
          if no_limit or no_logging:
              sys.exit(1)
          print(f'ok: 서비스 {len(services)}개 전부 상한·로그 회전 있음')
          PY

      # Adapts the Caddyfile and checks the resulting config. `validate` does not touch the network, so
      # no certificate is requested for the placeholder domain.
      - name: Validate Caddyfiles
        run: |
          for f in Caddyfile Caddyfile.prod; do
            echo "--- $f"
            docker run --rm \
              -e DOMAIN=app.example.invalid -e ACME_EMAIL=ci@example.invalid \
              -v "$PWD/$f:/etc/caddy/Caddyfile:ro" \
              caddy:2 caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
          done

      # 로케일 자동 판별(#110)의 `Vary` 는 Caddy 가 붙인다 — Next 15.5 가 app-router 200 응답의
      # `Vary` 를 자신의 RSC 값으로 덮어써서 앱에서는 붙일 수 없다(dashboard/middleware.ts 주석 참고).
      # 즉 이 줄이 사라지면 Cloudflare/Caddy 가 한 언어 응답을 다른 언어 방문자에게 줄 수 있는데,
      # 증상이 "가끔 언어가 틀리다"라서 배포 후에는 거의 잡히지 않는다. 그래서 여기서 존재를 고정한다.
      #
      # `/` 는 목록에서 빠졌다(#15): 랜딩이 apex(`landing/`)로 옮겨가면서 이 호스트의 `/` 는 언어에 따라
      # 갈리는 페이지가 아니라 고정 301 이 되었다. 그래서 없어야 하는 것까지 함께 고정한다 — 되살리면
      # 캐시 키만 쪼개진다.
      - name: Assert Caddyfiles declare locale Vary
        run: |
          for f in Caddyfile Caddyfile.prod; do
            grep -qF "header /login +Vary \"Accept-Language, Cookie, CF-IPCountry\"" "$f" \
              || { echo "[$f] /login 의 로케일 Vary 선언이 없다 (#110)" >&2; exit 1; }
            if grep -qF "header / +Vary" "$f"; then
              echo "[$f] / 는 이제 고정 301 이다 — 로케일 Vary 를 붙이지 않는다 (#15)" >&2; exit 1
            fi
          done
          echo "ok: 두 Caddyfile 모두 /login 에만 로케일 Vary 를 선언한다"

      # shellcheck cannot catch this class of bug: `var=$(grep ... | head -1)` aborts the whole script
      # under `set -e` + `pipefail` when grep matches nothing. That shipped and broke the default path on
      # the server. DRY_RUN stops right after the precheck block so CI can actually execute it.
      - name: Bootstrap prechecks (DRY_RUN)
        run: |
          ok_env=$'REPUTATION_POOL_API_KEY=ci-not-a-placeholder\nGRAFANA_ADMIN_PASSWORD=ci-not-a-placeholder\nREPUTATION_POOL_ALERTMANAGER_WEBHOOK_URL='

          # 남은 인자는 bootstrap.sh 의 **인자**로 넘긴다. `DRY_RUN=1 "$@" ./scripts/bootstrap.sh` 처럼
          # 쓰면 오버레이 파일명이 명령어 위치로 들어가 `command not found` 가 된다(실제로 그랬다).
          expect_pass() {
            local label="$1" want_tls="$2" env_body="$3"; shift 3
            printf '%s\n' "$env_body" > .env
            local out
            if ! out="$(DRY_RUN=1 ./scripts/bootstrap.sh "$@" 2>&1)"; then
              echo "[$label] 통과해야 하는데 실패했다" >&2; printf '%s\n' "$out" >&2; exit 1
            fi
            grep -q "tls_mode: $want_tls" <<< "$out" \
              || { echo "[$label] tls_mode 가 $want_tls 가 아니다" >&2; printf '%s\n' "$out" >&2; exit 1; }
            echo "ok: $label"
          }
          expect_reject() {
            local label="$1" env_body="$2"; shift 2
            printf '%s\n' "$env_body" > .env
            if DRY_RUN=1 ./scripts/bootstrap.sh "$@" > /dev/null 2>&1; then
              echo "[$label] 거부해야 하는데 통과했다" >&2; exit 1
            fi
            echo "ok: $label (거부됨)"
          }

          # 기본 경로 — DEPLOY_OVERLAYS 가 없는 것이 정상이며, 여기서 죽으면 안 된다(그 회귀가 있었다).
          expect_pass "DEPLOY_OVERLAYS 없음" no "$ok_env"
          expect_pass "DEPLOY_OVERLAYS=tls" yes "$ok_env"$'\nDEPLOY_OVERLAYS=compose.prod.tls.yaml'
          expect_pass "DEPLOY_OVERLAYS=6gb" no "$ok_env"$'\nDEPLOY_OVERLAYS=compose.prod.6gb.yaml'
          expect_pass "CLI 인자 tls" yes "$ok_env" compose.prod.tls.yaml
          expect_reject "없는 오버레이 (.env)" "$ok_env"$'\nDEPLOY_OVERLAYS=does-not-exist.yaml'
          expect_reject "없는 오버레이 (CLI 인자)" "$ok_env" does-not-exist.yaml
          expect_reject "placeholder 잔존" $'REPUTATION_POOL_API_KEY=local-dev-key\nGRAFANA_ADMIN_PASSWORD=x\nREPUTATION_POOL_ALERTMANAGER_WEBHOOK_URL='
          expect_reject "alertmanager 정의 없음" $'REPUTATION_POOL_API_KEY=x\nGRAFANA_ADMIN_PASSWORD=x'
          rm -f .env

      # bootstrap.sh runs as root on a public host — an unquoted expansion there is not a style issue.
      #
      # Pinned to an image rather than the runner's preinstalled shellcheck: the runner image's version
      # moves on its own schedule, so the same script can pass locally and fail here (it did — the two
      # versions disagreed on SC2015). Pinning makes local and CI report identically; bump deliberately.
      - name: Shellcheck deploy scripts
        run: |
          # LC_ALL 을 준다: 지적 대상 줄에 한글이 있으면 shellcheck 가 출력 인코딩에서
          # `commitBuffer: invalid argument (cannot encode character …)` 로 죽어 **지적 내용을 보여주지
          # 못한다.** 이 레포는 주석이 한글이라 거의 모든 지적이 그 경로를 탄다(실측).
          docker run --rm -e LC_ALL=C.UTF-8 -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            scripts/bootstrap.sh scripts/oci-launch-retry.sh scripts/backup.sh scripts/restore.sh \
            scripts/pull-deploy.sh scripts/install-pull-deploy.sh scripts/install-a1-hunter.sh \
            scripts/backup-offsite.sh scripts/cf-dns.sh scripts/migrate-host.sh

      # 이 두 스크립트는 **호스트를 실제로 옮길 때 딱 한 번** 도는데, 그때 인자 처리에서 죽으면 가장
      # 곤란하다(다른 스크립트와 달리 매일 돌면서 스스로 증명하지 않는다). 그래서 인자 검증을 토큰·SSH·
      # 네트워크보다 앞에 두고, 그 부분만 CI 가 실제로 실행한다 — bootstrap 의 DRY_RUN 하네스와 같은 이유.
      #
      # 특히 `--switch <구IP> <신IP>` 의 인자 순서 실수(같은 IP)는 스냅샷만 남고 아무것도 바뀌지 않는데
      # 로그는 성공으로 보이므로, 거부되는지를 여기서 고정한다.
      # 종료 코드만 보지 않고 **어떤 이유로 죽었는지**(stderr 문구)까지 고정한다. 코드만 비교하면
      # `--check not-an-ip` 가 IPv4 검증이 아니라 다른 이유로 1 을 반환해도 통과하고, 그 순간 이 스텝은
      # "거부되는지" 가 아니라 "죽는지" 만 지키는 테스트로 퇴화한다. 문구를 함께 보면 **네트워크에 닿기
      # 전에** 거부됐다는 것까지 함께 증명된다(이 문구들은 전부 토큰 로드·API 호출 앞에서 나온다).
      - name: Migration script arg validation
        run: |
          expect_exit() {
            local want="$1" label="$2" needle="$3"; shift 3
            local got=0 out
            out="$(CF_API_TOKEN='' CF_TOKEN_FILE=/nonexistent "$@" 2>&1)" || got=$?
            if [ "$got" != "$want" ]; then
              echo "[$label] exit $want 를 기대했는데 $got 였다" >&2
              printf '%s\n' "$out" >&2; exit 1
            fi
            # `-e` 는 필수다 — 문구가 `--check …` 처럼 대시로 시작하면 grep 이 옵션으로 해석해
            # "unrecognized option" 으로 죽는다(이 하네스를 처음 돌릴 때 실제로 걸렸다).
            if ! printf '%s' "$out" | grep -Fq -e "$needle"; then
              echo "[$label] 오류 문구에 '$needle' 이 없다 — 다른 이유로 죽었을 수 있다" >&2
              printf '%s\n' "$out" >&2; exit 1
            fi
            echo "ok: $label (exit $got)"
          }

          expect_exit 2 "cf-dns: 인자 없음"              "usage:"                    ./scripts/cf-dns.sh
          expect_exit 2 "cf-dns: 알 수 없는 인자"        "알 수 없는 인자"           ./scripts/cf-dns.sh --nope
          expect_exit 2 "cf-dns: 모드 중복"              "모드를 두 개 줄 수 없다"   ./scripts/cf-dns.sh --list --check 1.2.3.4
          expect_exit 2 "cf-dns: --check IP 누락"        "--check 에 IP 가 필요하다" ./scripts/cf-dns.sh --check
          expect_exit 2 "cf-dns: --switch 인자 부족"     "두 개가 필요하다"          ./scripts/cf-dns.sh --switch 1.2.3.4
          expect_exit 1 "cf-dns: IPv4 아님"              "IPv4 주소로 보이지 않는다" ./scripts/cf-dns.sh --check not-an-ip
          expect_exit 1 "cf-dns: 옥텟 범위 초과"         "IPv4 주소로 보이지 않는다" ./scripts/cf-dns.sh --check 300.1.1.1
          expect_exit 1 "cf-dns: 구=신 IP 거부"          "구 IP 와 신 IP 가 같다"    ./scripts/cf-dns.sh --switch 1.2.3.4 1.2.3.4
          expect_exit 1 "cf-dns: 없는 스냅샷"            "스냅샷 파일이 없다"        ./scripts/cf-dns.sh --restore /nonexistent.json
          expect_exit 1 "cf-dns: 토큰 없음(fail closed)" "CF_API_TOKEN 이 없다"      ./scripts/cf-dns.sh --list

          expect_exit 2 "migrate: 인자 없음"             "usage:"                    ./scripts/migrate-host.sh
          expect_exit 2 "migrate: 알 수 없는 인자"       "알 수 없는 인자"           ./scripts/migrate-host.sh --nope
          expect_exit 2 "migrate: --to 값 누락"          "--to 에 신규 호스트 IP"    ./scripts/migrate-host.sh --to
          expect_exit 2 "migrate: --workdir 값 누락"     "--workdir 에 경로"         ./scripts/migrate-host.sh --to 1.2.3.4 --workdir
          expect_exit 1 "migrate: --to IPv4 아님"        "IPv4 주소가 아니다"        ./scripts/migrate-host.sh --to nope
          expect_exit 1 "migrate: 없는 작업디렉터리"     "작업디렉터리가 없다"       ./scripts/migrate-host.sh --rollback /nonexistent-dir
          rm -rf migration-*

          # 오프사이트 백업의 **알림 경로**를 고정한다. 이 스크립트는 실패했을 때만 메일을 보내므로,
          # 메일이 안 나가게 된 회귀는 백업이 실패하는 날까지 드러나지 않는다 — 알림이 필요한 그날에.
          # 그래서 "어떤 실행이 메일을 보내는가" 를 CI 가 매번 실행해서 증명한다.
          #
          # runner 에는 oci CLI 가 없으므로 세 케이스 모두 `die "oci CLI 가 없다"` 로 떨어지고, 우리가
          # 보는 것은 그 die 가 **알림을 어떻게 처리했는가** 다.
          #
          # `INVOCATION_ID` 는 명시적으로 지우거나 넣는다. runner 프로세스가 systemd 아래에서 뜨면
          # 그 변수를 상속할 수 있어서, 지우지 않으면 "손 실행" 케이스가 손 실행이 아니게 된다.
          expect_exit 1 "offsite: ALERT_MAIL 오타 거부"  "auto|always|never" \
            env -u INVOCATION_ID OFFSITE_ALERT_MAIL=alwyas RP_BACKUP_ENV=/nonexistent ./scripts/backup-offsite.sh
          expect_exit 1 "offsite: 손 실행은 메일 생략"   "메일 생략" \
            env -u INVOCATION_ID RP_BACKUP_ENV=/nonexistent ./scripts/backup-offsite.sh
          # 이쪽이 이 변경의 핵심 안전망이다 — 자동 실행에서는 알림 경로에 **반드시 들어가야** 한다.
          # (메일 설정이 없으니 발송은 실패하고, 그 사실을 로그로 남기는 것까지가 기존 동작이다.)
          expect_exit 1 "offsite: systemd 실행은 메일 시도" "메일 설정이 없어" \
            env INVOCATION_ID=ci-test RP_BACKUP_ENV=/nonexistent RP_MAIL_ENV=/nonexistent ./scripts/backup-offsite.sh
          expect_exit 1 "offsite: always 는 손 실행도 메일" "메일 설정이 없어" \
            env -u INVOCATION_ID OFFSITE_ALERT_MAIL=always RP_BACKUP_ENV=/nonexistent RP_MAIL_ENV=/nonexistent ./scripts/backup-offsite.sh
          expect_exit 2 "offsite: 알 수 없는 인자"       "알 수 없는 인자" \
            env -u INVOCATION_ID ./scripts/backup-offsite.sh --nope

      # notify-mail.py runs on the server with no test suite around it; a syntax error would only
      # surface at the moment we actually need to send an alert. Compile it here.
      - name: Compile python scripts
        run: python3 -m py_compile scripts/notify-mail.py

      # Alert rules have the same exposure as the deploy artefacts above: nothing loads alerts.yml until
      # Prometheus reloads it on the server, so a typo — or worse, a rule that parses but can never fire —
      # would ship unnoticed. `check rules` covers syntax; `test rules` runs monitoring/alerts-test.yml,
      # which injects series and asserts firing/labels/annotations, so a rule that goes silently no-op
      # fails here instead of in production. Image pinned for the same reason as shellcheck: so local and
      # CI report identically.
      - name: Validate Prometheus alert rules
        run: |
          docker run --rm -v "$PWD/monitoring:/w:ro" -w /w --entrypoint promtool prom/prometheus:v3.1.0 \
            check rules alerts.yml slo-rules.yml
          docker run --rm -v "$PWD/monitoring:/w:ro" -w /w --entrypoint promtool prom/prometheus:v3.1.0 \
            test rules alerts-test.yml

      # Alertmanager's routing config has the same property. amtool parses the file and resolves the
      # receiver graph, so an unreachable route or an unknown receiver fails here rather than leaving
      # firing alerts silently unrouted on the server (#76).
      - name: Validate Alertmanager config
        run: |
