# 프로덕션 오버레이 (#15 / D8) — `compose.yaml` 위에 겹쳐 쓴다. 단독으로는 동작하지 않는다.
#
#   docker compose -f compose.yaml -f compose.prod.yaml pull
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
#
# (`scripts/bootstrap.sh` 가 이 두 줄을 대신 실행한다.)
#
# 이 파일은 **도메인·TLS 를 요구하지 않는다.** 도메인이 아직 없거나 임시 검증 호스트에 올릴 때 이 조합만
# 쓰면 평문 `:80` 으로 뜬다. 도메인을 붙일 때 `compose.prod.tls.yaml` 을 한 겹 더 얹는다:
#
#   docker compose -f compose.yaml -f compose.prod.yaml -f compose.prod.tls.yaml up -d
#   ./scripts/bootstrap.sh compose.prod.tls.yaml        # 동일
#
# base 와의 차이 네 가지:
#   1. app·dashboard 를 소스에서 빌드하지 않고 GHCR 에 발행된 이미지를 pull 한다
#      (`.github/workflows/release.yml`, arm64+amd64 멀티아치). 2 OCPU 서버에서 Gradle·Next 빌드를
#      돌리지 않기 위한 것이다.
#   2. Caddy 를 표준 포트 80 으로 옮긴다(base 는 로컬 편의용 8080).
#   3. 컨테이너별 메모리 상한을 준다. base 에는 상한이 없어 여덟 컨테이너가 호스트 RAM 을 무제한으로
#      경쟁하고, JVM 힙도 상한을 못 읽는다(Dockerfile 의 MaxRAMPercentage 참고).
#      base 에 서비스를 추가하면 여기에도 상한과 logging 을 추가해야 한다 — 빠뜨리면 그 컨테이너만
#      무제한이 된다.
#   4. db 의 호스트 포트 공개를 닫는다. base 의 `5435:5432` 는 로컬 편의용인데 0.0.0.0 바인딩이라
#      공개 서버에서는 Postgres 가 인터넷에 열린다.
#
# ⚠️ 이 조합만으로 공개하면 **평문 HTTP** 다. 관리 콘솔 로그인(#11)이 평문으로 나가므로, 도메인·TLS 를
# 붙이기 전에는 관리자 자격을 설정하지 않거나(미설정 시 `/api/**` 가 fail closed) 재사용하지 않는
# throwaway 값을 쓴다. 자세한 내용은 docs/engineering/deployment.md 의 "평문 모드".
#
# `!override`/`!reset` 태그는 Docker Compose v2.24.0+ 가 필요하다(그 이전 버전은 리스트를 병합해버려
# base 의 포트 공개가 남는다). bootstrap.sh 가 최신 compose 플러그인을 설치한다.

# 도커 기본 json-file 드라이버는 로그를 무한히 쌓는다 — 부트 볼륨이 차면 스택 전체가 멈추므로
# 서비스마다 회전 상한을 준다.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # 공개 서버에서 Postgres 를 인터넷에 노출하지 않는다. 접속이 필요하면 SSH 터널을 쓴다.
    ports: !override []
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 2g

  app:
    # 서버는 pull 만 한다 — build 섹션을 제거해야 `compose up` 이 소스 빌드로 되돌아가지 않는다.
    build: !reset null
    image: ghcr.io/preagile/reputation-pool-cloud/app:${APP_IMAGE_TAG:-latest}
    logging: *logging
    # JVM 진단 옵션 — **기본값은 빈 문자열이라 평시 오버헤드가 0 이다.**
    #
    # 힙 지표가 정상인데 컨테이너가 `exit 137` 로 죽는 경우(cgroup OOM-kill)를 조사할 때만 켠다. 힙 밖의
    # 소비자 — Metaspace·CodeCache·다이렉트 버퍼·스레드 스택·GC 구조체·native — 중 어느 쪽이 범인인지는
    # Micrometer 가 답하지 못한다. 영역별 합계는 대시보드의 'JVM 심층' 섹션이 보여주지만, JVM 이 보고하는
    # 값의 합과 cgroup 이 보는 RSS 사이의 차이(현재 약 2배)는 NMT 만이 분해할 수 있다.
    #
    #   .env 에 한 줄 넣고 app 만 재기동한다.
    #     JVM_DIAG_OPTS=-XX:NativeMemoryTracking=summary
    #   docker compose -f compose.yaml -f compose.prod.yaml up -d --force-recreate app
    #
    #   기준선을 먼저 남기고, 부하를 걸고, 차이를 본다.
    #     docker exec reputation-pool-app jcmd 1 VM.native_memory baseline
    #     docker exec reputation-pool-app jcmd 1 VM.native_memory summary.diff
    #
    # 조사 창이 끝나면 그 줄을 지우고 다시 재기동한다 — NMT 는 5~10% 의 CPU·메모리 오버헤드를 쓰고,
    # 2 OCPU 에서 그것은 무료가 아니다.
    #
    # 왜 ENTRYPOINT 가 아니라 JAVA_TOOL_OPTIONS 인가: Dockerfile 의 ENTRYPOINT 를 바꾸면 CI 재빌드와
    # 이미지 재발행을 거쳐야 한다. 조사 플래그는 켜고 끄는 주기가 짧으므로 이미지에 굽지 않는다.
    # 단, **이 environment 키의 값이 바뀌면 서비스 정의가 바뀐 것이므로 다음 배포에서 app 컨테이너가
    # 재생성된다** — 인메모리 풀은 체크포인트에서 복원되지만(Dockerfile 의 ExitOnOutOfMemoryError 주석)
    # 공짜는 아니다. 껐다 켜는 것을 습관으로 만들지 않는다.
    environment:
      JAVA_TOOL_OPTIONS: ${JVM_DIAG_OPTS:-}
    deploy:
      resources:
        limits:
          # 힙은 이 값의 70%(≈2.8GB) — Dockerfile 의 -XX:MaxRAMPercentage 가 cgroup 상한을 읽는다.
          memory: 4g

  dashboard:
    build: !reset null
    image: ghcr.io/preagile/reputation-pool-cloud/dashboard:${DASHBOARD_IMAGE_TAG:-latest}
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512m

  caddy:
    # base 의 8080 대신 표준 80 을 연다. 도메인·TLS 는 compose.prod.tls.yaml 이 담당하므로 여기서는
    # base Caddyfile(평문 `:80`, 같은 라우팅)을 그대로 쓴다 — 도메인이 없어도 스택이 뜬다.
    ports: !override
      - "80:80"
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128m

  prometheus:
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 1g

  # 알림 라우팅(#76). Go 프로세스 + 소량의 알림 상태만 들고 있어 실사용은 수십 MB 수준이다.
  # base 와 마찬가지로 호스트 포트를 열지 않는다(compose 네트워크 전용).
  alertmanager:
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256m

  grafana:
    # base 의 `127.0.0.1:3001` 바인딩을 그대로 둔다 — 공개 도메인에 노출하지 않고 SSH 터널로 본다
    # (`ssh -L 3001:127.0.0.1:3001 <서버>`). #15 Phase C 의 "관리자 UI 비노출" 항목.
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512m

  backup:
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256m

  # 백업 신선도 SLI 의 노출 경로 (#131). 기본 collector 를 전부 끄고 textfile 하나만 켜므로(base 의 주석
  # 참고) 실제 사용량은 수십 MB 다 — 64m 는 여유를 둔 값이고, 이 프로파일의 합계를 거의 움직이지 않는다.
  node-exporter:
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64m
